name: Bug report
description: Something misbehaved
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      description: The agent the conversation was with, as its CLI reports it.
      placeholder: codex-cli 0.149.0 · claude 2.1.240 · cursor-agent 2026.08.11
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: HarnessDesk version
      description: From the About window, or the commit if you built from source.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: checkboxes
    id: bundle
    attributes:
      label: Diagnostics
      description: >-
        Settings → General → Save bundle writes one reviewable file — versions,
        runtime health, the last 500 log lines — with credential shapes and
        your home directory scrubbed. It answers most questions we would
        otherwise have to ask.
      options:
        - label: I attached a diagnostics bundle, or explained why not
