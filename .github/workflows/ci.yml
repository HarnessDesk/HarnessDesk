name: CI

# Branches are covered by `pull_request`. Listing them under `push` as well
# ran the whole macOS job twice for one change — once for the push and once
# for the pull request — and on a private repository macOS minutes bill at ten
# times the standard rate, so the duplicate was the larger half of the bill.
# A branch with no pull request open now gets no run, which is the trade and
# the usual one: nothing here reaches main except through a pull request.
on:
  push:
    branches: [main]
  pull_request:

# A superseded run has nothing to tell us; cancel it rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, typecheck, test
    # macOS because that is the only platform HarnessDesk ships on, and the
    # desktop tests exercise macOS window geometry.
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      # Full history: `check-interface-drift` diffs CSS against `origin/main`,
      # and a depth-1 clone has no merge base to diff from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `build` is the whole node build plus the UI: it compiles every package
      # the test glob below reaches for, and copies the non-TypeScript fixtures
      # the tests spawn as real processes. Anything less and the tests that
      # spawn a fake agent fail on a binary that was never put in place.
      - name: Build
        run: pnpm run build

      # The per-test deadline is not about slow tests — most here finish in
      # ~18s. It is so that a test which hangs fails by name well inside the
      # job's twenty-five minutes instead of burning them and reporting
      # nothing. On Node 22 this flag caps each test *file*'s cumulative
      # time, not a single test's own — measured directly (round 2 of #972's
      # review: three files each holding two 1.5s tests, each with its own
      # `{ timeout: 10000 }`, still failed as a whole file at the flag's
      # value); a per-test default on newer Node, where the same run passes.
      # A per-test option can only ever narrow the file-cumulative ceiling
      # here, never widen it. The four flow-host-evidence end-to-end files
      # legitimately need more than this, so they run in their own step
      # below instead of sharing this one; everything else fits inside it.
      #
      # The exclusion is a `find`, not a second glob, because node's own
      # glob matching has no negation syntax. Still the same glob as before,
      # minus the four files the next step covers, so a package that gains
      # tests is covered here the day it does.
      - name: Node tests
        run: bash -c "node --test --test-timeout=120000 \$(find packages/*/dist/test -name '*.test.js' ! -name 'flow-host-evidence-*.test.js')"

      # The worst of these four files, flow-host-evidence-review.test.ts,
      # has 7 end-to-end cases and took 33s measured with nothing else
      # running. Each case's own ceiling is 260s (`E2E`) behind an internal
      # 200s safety dump (`SAFETY_MS`) that names exactly what did not move
      # on the desk — both in `test/fixtures/flow-host-evidence.ts`. Sized
      # for the worst realistic combination for that file: its own measured
      # normal total, one case genuinely stuck reaching its full 260s outer
      # bound, and headroom for several others running as slow as this
      # suite has actually observed under load (92-100s each, #972).
      - name: Flow-host-evidence tests
        run: node --test --test-timeout=600000 "packages/server/dist/test/flow-host-evidence-*.test.js"

      - name: UI typecheck
        run: pnpm --filter @harnessdesk/ui run typecheck

      - name: UI tests
        run: pnpm --filter @harnessdesk/ui run test

      - name: Desktop tests
        run: pnpm --filter @harnessdesk/desktop run test

      # Codex is not installed on the runner, so the protocol-drift and layering
      # checks are split out: layering is pure source analysis and always runs,
      # while drift needs a real `codex` binary and is checked locally and in the
      # release job.
      - name: Layering rule
        run: node script/check-layering.mjs

      - name: Half-applied fixes
        run: node script/check-half-applied-fixes.mjs

      - name: Tracked secrets
        run: node script/check-secrets.mjs

      # Also pure source analysis: every method the host answers has to be
      # callable from the renderer or the desktop's main process, or be pinned
      # as deliberately unreachable with the reason.
      - name: Reachable methods
        run: node script/check-reachable.mjs

      # Pure source analysis, like layering: it reads the ledger of what live
      # recordings proved and checks each claim still names a test that exists.
      # The recordings themselves need signed-in vendor agents and cannot run
      # here — the link is what rots silently, and the link is what this holds.
      - name: Recorded claims
        run: node script/check-claims.mjs

      # The other pure-source check on the prose: every repository path the
      # documentation names in backticks has to resolve to a file, or be
      # recorded as naming something outside this tree.
      - name: Doc paths
        run: node script/check-doc-paths.mjs

      # The gate's own tests. `verify.mjs` runs these and CI did not, so a
      # regression in the checks themselves could merge while the local gate
      # stayed green.
      - name: Gate tests
        run: node --test "script/*.test.mjs"

      # Everything below this line was run by `pnpm verify` and not by CI, which
      # is the direction that fails silently: a check nobody runs on a pull
      # request is a check that only catches what somebody remembered to run
      # locally. `script/check-verify-drift.mjs` exists to keep the two lists
      # equal and is itself one of them.
      - name: Third-party notices
        run: node script/check-notices.mjs

      - name: Design tokens
        run: node script/check-design-tokens.mjs

      - name: Design drift
        run: node script/design-audit.mjs --strict

      - name: UI system
        run: node script/check-ui-system.mjs

      - name: Interface drift
        run: node script/check-interface-drift.mjs

      - name: Design doc
        run: node script/design-doc.mjs --check

      - name: Gate matches CI
        run: node script/check-verify-drift.mjs

      - name: Steps are documented
        run: node script/check-verify-steps.mjs

  package:
    name: Package (unsigned)
    runs-on: macos-14
    needs: verify
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Build app bundle
        working-directory: packages/desktop
        run: >
          ./node_modules/.bin/electron-builder --mac dir
          -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false

      - uses: actions/upload-artifact@v7
        with:
          name: HarnessDesk-unsigned
          path: packages/desktop/release/mac-*/HarnessDesk.app
          retention-days: 7

  ui-system-browser:
    name: UI system browser integration
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Vite resolves workspace packages through their compiled `dist` entry.
      # A clean runner has none until the Node build creates them.
      - run: pnpm run build:node
      - run: pnpm exec playwright install chromium
      - run: pnpm test:ui-system

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-system-browser-report
          path: output/playwright/ui-system/
          retention-days: 7

  ui-system-native:
    name: UI system native integration
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test:ui-system:native

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-system-native-report
          path: output/native-ui-system/
          retention-days: 7
