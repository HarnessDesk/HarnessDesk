name: Private phone compatibility diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          log="$RUNNER_TEMP/phone2038-install.log"
          trap 'rm -f "$log"' EXIT
          pnpm install --frozen-lockfile > "$log" 2>&1 || { echo 'install failed'; exit 1; }
      - name: Build pinned source
        run: |
          log="$RUNNER_TEMP/phone2038-build.log"
          trap 'rm -f "$log"' EXIT
          pnpm run build > "$log" 2>&1 || { echo 'build failed'; exit 1; }
      - run: node diagnostic/phone2038/controller.mjs
