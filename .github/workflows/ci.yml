name: Native retention pilot

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Diagnostic mode
        required: true
        type: choice
        default: one-chat
        options:
          - one-chat
          - automatic-profile

permissions:
  contents: read

jobs:
  setup-checkpoint:
    name: Synthetic setup checkpoint
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Refuse ambient profile locations
        run: node diagnostic/retention-pilot/ambient-shape.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: One synthetic conversation and receipt
        if: inputs.profile == 'one-chat'
        run: |
          node diagnostic/retention-pilot/ambient-shape.mjs
          node diagnostic/retention-pilot/controller.mjs
      - name: Automatic policy measurement
        if: inputs.profile == 'automatic-profile'
        run: |
          node diagnostic/retention-pilot/ambient-shape.mjs
          node diagnostic/retention-pilot/automatic-profile.mjs
