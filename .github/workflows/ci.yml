name: CI

# Feature branches are covered by pull_request without duplicating push runs.
# Development adds reached browser specs on every push; its release PR and main run full CI.
on:
  push:
    branches: [main, development]
  pull_request:
    # Not on labels: `full-ci` starts its own full run (full-ci-label.yml).
    types: [opened, synchronize, reopened]
  # Runs started by hand always prove the full suite.
  workflow_dispatch:

# Each development push checks its own range, so give it a separate group:
# neither running nor pending coverage may be cancelled by the next push.
# Event names also keep pushes separate from the nightly full dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/development' && github.sha || 'latest' }}
  # A pull request's newer push supersedes its older run. Main never cancels:
  # on a busy main every push cancelled the run before it, so for over an hour
  # no combined state of main was checked in full, and "main is green" could
  # not be shown (#1140).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: UI integration inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.paths.outputs.tier }}
      browser: ${{ steps.paths.outputs.browser }}
      native: ${{ steps.paths.outputs.native }}
      server_specs: ${{ steps.paths.outputs.server_specs }}
      browser_specs: ${{ steps.paths.outputs.browser_specs }}
      matrix: ${{ steps.paths.outputs.matrix }}
      shard_count: ${{ steps.paths.outputs.shard_count }}
      shards: ${{ steps.paths.outputs.shards }}
      record: ${{ steps.paths.outputs.record }}
      unit_mode: ${{ steps.paths.outputs.unit_mode }}
      unit_shard_count: ${{ steps.paths.outputs.unit_shard_count }}
      unit_shards: ${{ steps.paths.outputs.unit_shards }}
      node_jobs: ${{ steps.paths.outputs.node_jobs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Prefer this branch's last full-run map, then main's (script/ui-impact.mjs).
      # Development's nightly map includes source that has not shipped on main;
      # unresolved reads/ranges and missing maps run every browser spec.
      - name: Restore the branch impact map
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/development')
        uses: actions/cache/restore@v6
        with:
          path: ui-impact-map.json
          key: ui-impact-map-${{ github.ref_name }}-none
          restore-keys: |
            ui-impact-map-${{ github.ref_name }}-
            ui-impact-map-main-
            ui-impact-map-
      - name: Select UI integration jobs
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          UI_IMPACT_MAP: ui-impact-map.json
          CI_HEAD_BRANCH: ${{ github.head_ref }}
          CI_REF_NAME: ${{ github.ref_name }}
          CI_BEFORE: ${{ github.event.before }}
          CI_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_TOKEN: ${{ github.token }}
        run: |
          list="$RUNNER_TEMP/ci-changed-paths"
          rm -f "$list"
          theme=false
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The merge's base parent covers the whole PR, including moved inputs.
            base=HEAD^1
          elif [ "$EVENT_NAME" = "push" ] && [ "$CI_REF_NAME" = "development" ]; then
            # Checkout has only two commits. A multi-commit push can start earlier;
            # fetch that exact object rather than diffing just the last commit.
            if [[ "$CI_BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ "$CI_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
              if git cat-file -e "$CI_BEFORE^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$CI_BEFORE"; then
                if git cat-file -e "$CI_BEFORE^{commit}" 2>/dev/null; then
                  base="$CI_BEFORE"
                fi
              fi
            fi
          fi
          # A missing/zero/unavailable before leaves no list: every browser spec runs.
          if [ -n "$base" ]; then
            if ! git diff --no-renames --name-only -z "$base" HEAD > "$list"; then
              rm -f "$list"
            fi
            # Theme metadata uses exactly the same change boundary as the paths.
            # The last grep reads to the end: an early -q exit would make the
            # diff die of SIGPIPE on a large change, failing the pipe under pipefail.
            if git diff --no-renames -U0 "$base" HEAD -- packages/ui | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' | grep -Ei 'dark|theme' > /dev/null; then
              theme=true
            fi
          fi
          # A pushed tree that a full run already passed in full (the `proof`
          # job below) does not run the browser suite again. Artifacts are read
          # across branches, so a batch head's proof reaches its landing; one
          # made from a fork, which runs its own copy of this workflow, does
          # not count. Any failure to ask leaves the push to run as it always has.
          proven=""
          if [ "$EVENT_NAME" = "push" ]; then
            tree=$(git rev-parse 'HEAD^{tree}')
            proven=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=proven-tree-$tree&per_page=5" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id) | .workflow_run.id][0] // empty' 2>/dev/null || true)
          fi
          CI_PROVEN_BY="$proven" UI_THEME_TOUCHED="$theme" node script/ci-changes.mjs "$list" > "$RUNNER_TEMP/ci-plan"
          cat "$RUNNER_TEMP/ci-plan" >> "$GITHUB_OUTPUT"
          sed -n 's/^summary=//p' "$RUNNER_TEMP/ci-plan" >> "$GITHUB_STEP_SUMMARY"

          # The same changed paths select unit tests once, before any install.
          node script/ci-unit-tests.mjs "$list" > "$RUNNER_TEMP/ci-unit-plan"
          sed -n 's/^summary=//p' "$RUNNER_TEMP/ci-unit-plan" >> "$GITHUB_STEP_SUMMARY"
          unit_mode=$(sed -n 's/^mode=//p' "$RUNNER_TEMP/ci-unit-plan")
          unit_count=1
          case "$unit_mode" in
            # A related selection (local check:push still uses it) took as long
            # on one runner as the dealt suite on four: p50 4.8 against 5.1
            # minutes, p90 8.7 against 6.7. CI runs the dealt suite.
            all|related) unit_mode=all; unit_count=$(node script/ci-unit-shards.mjs --count) ;;
            none) unit_count=0 ;;
            *) echo "Unknown unit mode: $unit_mode"; exit 1 ;;
          esac
          echo "unit_mode=$unit_mode" >> "$GITHUB_OUTPUT"
          echo "unit_shard_count=$unit_count" >> "$GITHUB_OUTPUT"
          # Keep [1] even when skipped, so the matrix is always well formed.
          unit_shards=$(node -e 'console.log(JSON.stringify(Array.from({ length: Math.max(1, Number(process.argv[1])) }, (_, i) => i + 1)))' "$unit_count")
          echo "unit_shards=$unit_shards" >> "$GITHUB_OUTPUT"

          # The Node-package tests, dealt into jobs by recorded seconds (script/node-tests.mjs).
          node script/node-tests.mjs --plan > "$RUNNER_TEMP/node-plan"
          sed -n 's/^node_jobs=/node_jobs=/p' "$RUNNER_TEMP/node-plan" >> "$GITHUB_OUTPUT"
          sed -n 's/^summary=//p' "$RUNNER_TEMP/node-plan" >> "$GITHUB_STEP_SUMMARY"

  # The project's own Linux runner takes the two jobs that start at once, while
  # it is up, which leaves two hosted slots for the shards behind them. A job
  # sent to a runner that is down waits in the queue for a day, so the hosted
  # runner is the answer whenever this cannot show the self-hosted one online:
  # no token (forks never get one), any failure to ask, or less than half an
  # hour before the runner's scheduled stop (`SELF_HOSTED_UNTIL`, Pacific).
  runners:
    name: CI runners
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
    steps:
      - name: Pick the Linux runner
        id: pick
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          # A pull request whose fork was deleted has no head repository; it
          # must not pass for one of this repository's own branches.
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || (github.event.pull_request && 'deleted-fork' || github.repository) }}
          SELF_HOSTED_UNTIL: ${{ vars.SELF_HOSTED_UNTIL || '1830' }}
        run: |
          linux='"ubuntu-latest"'
          now=$(TZ=America/Los_Angeles date +%H%M)
          if [ -n "$RUNNER_STATUS_TOKEN" ] && [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ] && (( 10#$now < 10#$SELF_HOSTED_UNTIL )); then
            online=$(GH_TOKEN="$RUNNER_STATUS_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.status == "online" and any(.labels[]; .name == "azure-linux"))] | length' 2>/dev/null || echo 0)
            if [ "${online:-0}" -gt 0 ]; then
              linux='["self-hosted","azure-linux"]'
            fi
          fi
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "Linux runner for typecheck and gates: $linux" >> "$GITHUB_STEP_SUMMARY"

  # A separate check names the tier without changing branch protection's check
  # names. land-safe matches this proof to the required checks' check-suite id.
  ci-tier:
    name: "CI tier: ${{ needs.changes.outputs.tier }}"
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the CI tier
        env:
          CI_TIER: ${{ needs.changes.outputs.tier }}
        run: |
          case "$CI_TIER" in full|bounded) ;; *) exit 1 ;; esac
          echo "CI tier: $CI_TIER" | tee -a "$GITHUB_STEP_SUMMARY"

  # The Node-package tests. `script/node-tests.mjs` is their manifest: which
  # file runs in which `node --test` invocation, under which per-file deadline
  # and on which runtime, and how they are dealt into jobs of about five
  # minutes each by the seconds the last measurement recorded. One job ran
  # every group in turn and took as long as all of them added together (the
  # Lead end-to-end file alone took 21-29 minutes, on every pull request).
  # Each job repeats the checkout, install and build, about a minute, in
  # parallel; `verify` at the end keeps the one name branch protection reads.
  node-tests:
    name: Node tests ${{ matrix.job }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.node_jobs) }}
    # A dealt job carries about five minutes of tests. The widest per-file
    # deadline is ten minutes (a case stuck to its own ceiling must still say
    # so by name); this limit only stops a runaway.
    timeout-minutes: 25

    steps:
      # No Node test reads this repository's history: one commit is enough.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          # 22 for the package floor; 26 for the Lead's groups, whose child and
          # network-denial probes need a permission model that blocks the network.
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install fixture shell
        run: sudo apt-get update && sudo apt-get install --yes zsh

      - run: pnpm install --frozen-lockfile

      # `build` is the whole node build plus the UI: it compiles every package
      # the tests reach for, and copies the non-TypeScript fixtures the tests
      # spawn as real processes.
      - name: Build
        run: pnpm run build

      # Spec output: its closing summary names every failing test.
      - name: Node tests
        env:
          NODE_JOB: ${{ matrix.job }}
          HD_NODE_TEST_SECONDS: output/node-tests/${{ matrix.job }}
        run: node script/node-tests.mjs --job $NODE_JOB

      # Each file's measured seconds: `node script/node-tests.mjs --refresh`
      # folds a run's into the table that deals the next.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: node-test-seconds-${{ matrix.job }}
          path: output/node-tests/
          retention-days: 7
          if-no-files-found: ignore

  ui-typecheck:
    name: UI typecheck and desktop tests
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.linux) }}
    # These run once, alongside the shards. Fifteen minutes leaves ample room
    # for install/build/typecheck and desktop tests while bounding a runaway.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build:node

      - name: UI typecheck
        run: pnpm --filter @harnessdesk/ui run typecheck

      - name: Desktop tests
        run: pnpm --filter @harnessdesk/desktop run test

  ui-unit-tests:
    name: UI unit tests shard ${{ matrix.shard }}/${{ needs.changes.outputs.unit_shard_count }}
    needs: changes
    if: needs.changes.outputs.unit_mode != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.unit_shards) }}
    # A full-suite deal plans about 125s of tests plus 60s of setup per shard.
    timeout-minutes: 15
    env:
      UNIT_MODE: ${{ needs.changes.outputs.unit_mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest transforms UI source itself and reads workspace packages from
      # dist. Verified list and a small deal with no UI dist: build:node suffices;
      # building the renderer would add work without supplying test inputs.
      - run: pnpm run build:node

      - name: Deal UI tests
        id: deal
        if: needs.changes.outputs.unit_mode == 'all'
        run: |
          deal="$RUNNER_TEMP/unit-deal"
          node script/ci-unit-shards.mjs ${{ matrix.shard }}/${{ needs.changes.outputs.unit_shard_count }} > "$deal"
          # The empty-deal guard lives here, before the test step can run the whole suite.
          test -s "$deal"
          echo "files=$(paste -sd ' ' "$deal")" >> "$GITHUB_OUTPUT"

      - name: UI tests
        if: needs.changes.outputs.unit_mode == 'all'
        env:
          UNIT_DEAL: ${{ steps.deal.outputs.files }}
        run: pnpm --filter @harnessdesk/ui run test $UNIT_DEAL

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    needs: [changes, ui-typecheck, ui-unit-tests]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require typecheck, desktop and the selected unit tests
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          UNIT_MODE: ${{ needs.changes.outputs.unit_mode }}
          TYPECHECK_RESULT: ${{ needs.ui-typecheck.result }}
          SHARDS_RESULT: ${{ needs.ui-unit-tests.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "UI unit input selection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          case "$TYPECHECK_RESULT/$SHARDS_RESULT/$UNIT_MODE" in
            success/success/all|success/skipped/none)
              exit 0
              ;;
          esac
          echo "UI typecheck/unit results did not agree ($TYPECHECK_RESULT/$SHARDS_RESULT/$UNIT_MODE)."
          exit 1

  gates:
    name: Gates
    needs: runners
    runs-on: ${{ fromJSON(needs.runners.outputs.linux) }}
    timeout-minutes: 25

    steps:
      # Full history: `check-interface-drift` diffs CSS against `origin/main`,
      # and a depth-1 clone has no merge base to diff from.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Codex is not installed on the runner, so the protocol-drift and layering
      # checks are split out: layering is pure source analysis and always runs,
      # while drift needs a real `codex` binary and is checked locally and in the
      # release job.
      - name: Layering rule
        run: node script/check-layering.mjs

      - name: Half-applied fixes
        run: node script/check-half-applied-fixes.mjs

      - name: Tracked secrets
        run: node script/check-secrets.mjs

      # Also pure source analysis: every method the host answers has to be
      # callable from the renderer or the desktop's main process, or be pinned
      # as deliberately unreachable with the reason.
      - name: Reachable methods
        run: node script/check-reachable.mjs

      # Pure source analysis, like layering: it reads the ledger of what live
      # recordings proved and checks each claim still names a test that exists.
      # The recordings themselves need signed-in vendor agents and cannot run
      # here — the link is what rots silently, and the link is what this holds.
      - name: Recorded claims
        run: node script/check-claims.mjs

      # The other pure-source check on the prose: every repository path the
      # documentation names in backticks has to resolve to a file, or be
      # recorded as naming something outside this tree.
      - name: Doc paths
        run: node script/check-doc-paths.mjs

      # The gate's own tests. `verify.mjs` runs these and CI did not, so a
      # regression in the checks themselves could merge while the local gate
      # stayed green.
      - name: Gate tests
        run: node --test "script/*.test.mjs"

      # Everything below this line was run by `pnpm verify` and not by CI, which
      # is the direction that fails silently: a check nobody runs on a pull
      # request is a check that only catches what somebody remembered to run
      # locally. `script/check-verify-drift.mjs` exists to keep the two lists
      # equal and is itself one of them.
      - name: Third-party notices
        run: node script/check-notices.mjs

      - name: Design tokens
        run: node script/check-design-tokens.mjs

      - name: Design drift
        run: node script/design-audit.mjs --strict

      - name: UI system
        run: node script/check-ui-system.mjs

      - name: Interface drift
        run: node script/check-interface-drift.mjs

      - name: Alignment census
        run: node script/check-alignment-census.mjs
        env:
          # A push to main answers for the whole pushed range, not its last commit.
          ALIGNMENT_CENSUS_SINCE: ${{ github.event_name == 'push' && github.event.before || '' }}

      - name: Design doc
        run: node script/design-doc.mjs --check

      # The command-line reference is written out of the command table, which
      # it reads from the build above, so a table edit that did not regenerate
      # `docs/cli.md` is red here and not only on the machine that forgot.
      - name: CLI reference
        run: node script/cli-doc.mjs --check

      - name: Gate matches CI
        run: node script/check-verify-drift.mjs

      - name: Steps are documented
        run: node script/check-verify-steps.mjs

  verify:
    name: Build, typecheck, test
    runs-on: ubuntu-latest
    needs: [node-tests, ui-tests, gates]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Require every part of the gate
        env:
          NODE_TESTS_RESULT: ${{ needs.node-tests.result }}
          UI_TESTS_RESULT: ${{ needs.ui-tests.result }}
          GATES_RESULT: ${{ needs.gates.result }}
        run: |
          failed=0
          for part in "node-tests:$NODE_TESTS_RESULT" "ui-tests:$UI_TESTS_RESULT" "gates:$GATES_RESULT"; do
            if [ "${part#*:}" != "success" ]; then
              echo "${part%%:*} did not succeed (${part#*:})."
              failed=1
            fi
          done
          exit "$failed"

  package:
    name: Package (unsigned)
    runs-on: macos-14
    needs: verify
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Build app bundle
        working-directory: packages/desktop
        run: >
          ./node_modules/.bin/electron-builder --mac dir
          -c.mac.identity=- -c.mac.notarize=false -c.mac.hardenedRuntime=false

  # Build the fixture pages once; the shards of a non-recording run share these
  # bytes. A recording run builds them too, though its shards stay on the dev
  # server: a build that no longer works then fails the run that broke it, not
  # the next pull request that happens to select a static spec.
  ui-system-build:
    needs: changes
    if: needs.changes.outputs.browser == 'all'
    name: UI system pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UI_SYSTEM_MATRIX: pr
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:node
      - run: pnpm run build:e2e
      # A run that does not record serves every shard from this build, so the build is tested there.
      # A recording run (`main`, or a change to the suite itself) runs its shards on the dev server, and
      # a build that compiled but cannot run would go unnoticed until the next pull request met it. So
      # it runs a few specs from each built page here, before any shard starts.
      - name: Install the browser to try the build
        if: needs.changes.outputs.record == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Try the build
        if: needs.changes.outputs.record == 'true'
        env:
          # The pages built above are the build under test.
          UI_SYSTEM_PAGES: prebuilt
        run: |
          node script/ui-system-run.mjs e2e/ui-system/surfaces.spec.ts e2e/ui-system/narrow-right-panel-overlay.spec.ts e2e/ui-system/code-block.spec.ts
          node script/ui-system-run.mjs e2e/ui-system/side-by-side.spec.ts --grep "two Seat browsers stay live"
      # Only a run that does not record downloads the pages; a recording run's shards read the dev server.
      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.record != 'true'
        with:
          name: ui-system-pages
          path: packages/ui/dist-e2e/
          retention-days: 1
          if-no-files-found: error
      # Keep diagnostics briefly after failures or cancellation.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: ui-system-build-report
          path: output/playwright/ui-system/
          retention-days: 3
          if-no-files-found: ignore

  ui-system-browser:
    needs: [changes, ui-system-build]
    if: needs.changes.outputs.browser == 'all'
    name: UI system browser integration shard ${{ matrix.shard }}/${{ needs.changes.outputs.shard_count }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # As many shards as the work needs, from one to sixteen: each carries
        # about 1,500 recorded dev-server seconds of tests. Static runs finish
        # earlier; script/ci-browser-shards.mjs still sizes the shards from those
        # times and script/ci-changes.mjs counts them. Development pushes also
        # run the bounded selection. A skipped browser job keeps [1] so its
        # matrix stays well formed.
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    env:
      # What this run is: its theme matrix and the specs it covers. The shards
      # of one run read the same two values, so they deal the same plan.
      UI_SYSTEM_MATRIX: ${{ needs.changes.outputs.matrix }}
      UI_SYSTEM_SPECS: ${{ needs.changes.outputs.browser_specs }}
    # A balanced full-suite shard takes about 22 minutes; the slowest of five
    # recent recording runs took 28. The 90-second per-test timeout catches a
    # hung test; this limit only stops a runaway.
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          # The complete browser deal includes the real Lead host/child specs.
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Vite resolves workspace packages through their compiled `dist` entry.
      # A clean runner has none until the Node build creates them.
      - run: pnpm run build:node
      - run: pnpm exec playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.record != 'true'
        with:
          name: ui-system-pages
          path: packages/ui/dist-e2e/
      - name: Run this shard's specs
        env:
          UI_IMPACT_SHARD: ${{ matrix.shard }}
          # A run of the whole suite also records which UI modules each spec ran, for the
          # pull requests that come after it (script/ui-impact.mjs); a pull request that
          # runs part of it records nothing.
          RECORD: ${{ needs.changes.outputs.record }}
          UI_SYSTEM_SERVER: dev
          # The pages downloaded above are the build under test; anywhere else the runner rebuilds them.
          UI_SYSTEM_PAGES: prebuilt
        run: |
          mapfile -t specs < <(node script/ci-browser-shards.mjs ${{ matrix.shard }}/${{ needs.changes.outputs.shard_count }})
          # An empty deal must never accidentally run the entire suite.
          test "${#specs[@]}" -gt 0
          if [ "$RECORD" = "true" ]; then
            mkdir -p output/ui-impact
            UI_IMPACT_DIR="$PWD/output/ui-impact" pnpm test:ui-system --tsconfig script/ui-impact/tsconfig.json "${specs[@]}"
            # How many tests each of these specs has: a record with fewer is partial, and its spec is not planned from it.
            pnpm --silent test:ui-system --list --reporter=json "${specs[@]}" > "output/ui-impact/expected-$UI_IMPACT_SHARD.json"
          else
            node script/ui-system-run.mjs "${specs[@]}"
          fi

      - uses: actions/upload-artifact@v7
        if: success() && needs.changes.outputs.record == 'true'
        with:
          name: ui-impact-${{ matrix.shard }}
          path: output/ui-impact/
          retention-days: 3

      # Keep diagnostics briefly after failures or cancellation (including partial runs).
      # Successful shards need no stored report.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: ui-system-browser-report-${{ matrix.shard }}
          path: output/playwright/ui-system/
          retention-days: 3

  # The records of a full run, folded into one map and kept for the pull requests
  # that come next. Only a clean full run makes one; main and development keep it.
  ui-impact-map:
    name: UI impact map
    needs: [changes, ui-system-browser]
    if: needs.changes.outputs.record == 'true' && needs.ui-system-browser.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: ui-impact-*
          path: impact-records
          merge-multiple: true
      # A run whose records cannot make a map fails this job, in the open. It gates nothing (the
      # required checks do not wait for it), but a green job that saved no map is how a broken scan
      # goes unseen: pull requests then plan without a map, which is slow and safe, and nobody knows.
      - name: Merge the records into a map
        run: |
          node script/ui-impact.mjs merge impact-records --commit "$GITHUB_SHA" --out ui-impact-map.json
          test -s ui-impact-map.json
      - uses: actions/upload-artifact@v7
        with:
          name: ui-impact-map
          path: ui-impact-map.json
          retention-days: 14
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
        with:
          path: ui-impact-map.json
          key: ui-impact-map-${{ github.ref_name }}-${{ github.sha }}

  ui-system-server:
    needs: changes
    if: needs.changes.outputs.browser == 'server'
    name: UI system server-facing browser specs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          # Server-facing browser specs include the real Lead host/child.
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:node
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run specs that import packages outside the UI
        env:
          SERVER_SPECS: ${{ needs.changes.outputs.server_specs }}
        run: |
          mapfile -t specs < <(node -e 'for (const spec of JSON.parse(process.env.SERVER_SPECS)) console.log(spec)')
          # An empty discovery must never accidentally run the entire suite.
          test "${#specs[@]}" -gt 0
          pnpm test:ui-system "${specs[@]}"

      # Keep diagnostics briefly after failures or cancellation (including partial runs).
      # Successful specs need no stored report.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: ui-system-server-report
          path: output/playwright/ui-system/
          retention-days: 3

  ui-system-browser-integration:
    name: UI system browser integration
    runs-on: ubuntu-latest
    needs: [changes, ui-system-build, ui-system-browser, ui-system-server]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Require browser success or an intentional skip
        env:
          CI_TIER: ${{ needs.changes.outputs.tier }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          BROWSER: ${{ needs.changes.outputs.browser }}
          SHARDS_RESULT: ${{ needs.ui-system-browser.result }}
          SERVER_RESULT: ${{ needs.ui-system-server.result }}
          BUILD_RESULT: ${{ needs.ui-system-build.result }}
        run: |
          echo "CI tier: $CI_TIER"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "UI integration input selection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          expected_build=skipped
          if [ "$BROWSER" = "all" ]; then
            expected_build=success
          fi
          if [ "$BUILD_RESULT" != "$expected_build" ]; then
            echo "UI pages build did not match the requested run ($BUILD_RESULT; expected $expected_build)."
            exit 1
          fi
          case "$BROWSER/$SHARDS_RESULT/$SERVER_RESULT" in
            all/success/skipped|server/skipped/success|none/skipped/skipped)
              exit 0
              ;;
          esac
          echo "Browser selection/results did not agree ($BROWSER/$SHARDS_RESULT/$SERVER_RESULT)."
          exit 1

  ui-system-native:
    name: UI system native smoke
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test:ui-system:native

      # Keep diagnostics briefly after failures or cancellation (including partial runs).
      # Successful smoke runs need no stored report.
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: ui-system-native-report
          path: output/native-ui-system/
          retention-days: 3

  ui-system-native-integration:
    name: UI system native integration
    runs-on: ubuntu-latest
    needs: [changes, ui-system-native]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Require native success or an intentional skip
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          SMOKE_RESULT: ${{ needs.ui-system-native.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "UI integration input selection did not succeed ($CHANGES_RESULT)."
            exit 1
          fi
          if [ "$SMOKE_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$NATIVE" = "false" ] && [ "$SMOKE_RESULT" = "skipped" ]; then
            echo "No native integration inputs changed."
            exit 0
          fi
          echo "UI system native smoke did not succeed ($SMOKE_RESULT)."
          exit 1

  # A full run that passed every part, the whole browser suite and native
  # smoke included, names the tree it tested. A push of that same tree (a
  # batch head or the release pull request landing on a branch that had not
  # moved) reads this and runs core CI only. It gates nothing itself.
  proof:
    name: Tree proof
    needs: [changes, verify, ui-system-browser-integration, ui-system-native-integration]
    if: >-
      needs.changes.outputs.tier == 'full' && needs.changes.outputs.browser == 'all'
      && needs.changes.outputs.browser_specs == 'all' && needs.changes.outputs.native == 'true'
      && needs.verify.result == 'success' && needs.ui-system-browser-integration.result == 'success'
      && needs.ui-system-native-integration.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Name the tested tree
        id: tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          mkdir -p output/proof
          printf 'tree=%s\nsha=%s\nrun=%s\n' "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" > output/proof/proof.txt
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: proven-tree-${{ steps.tree.outputs.tree }}
          path: output/proof/
          retention-days: 14
