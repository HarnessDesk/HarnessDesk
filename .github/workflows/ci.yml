name: Native retention pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-checkpoint:
    name: Synthetic setup checkpoint
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: One synthetic conversation and receipt
        run: node diagnostic/retention-pilot/controller.mjs
