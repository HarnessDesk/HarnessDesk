name: Private synthetic stop history proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Refuse ambient profile locations
        run: node diagnostic/stop-history/ambient-shape.mjs
      - name: Install dependencies
        timeout-minutes: 10
        run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Synthetic native proof
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/hd2065-private-frames"
          test ! -e "$proof_dir"
          if ! node --test diagnostic/stop-history/seed.test.mjs diagnostic/stop-history/counter.test.mjs diagnostic/stop-history/frame-policy.test.mjs diagnostic/stop-history/run-guarded.test.mjs diagnostic/stop-history/source-guard.test.mjs diagnostic/stop-history/report.test.mjs diagnostic/stop-history/presentation.test.mjs > "$RUNNER_TEMP/hd2065-toy.log" 2>&1; then echo 'fixture controls failed'; exit 1; fi
          if ! HD_2065_PINNED_MENTIONS="$PWD/packages/server/dist/src/intake/mentions.js" node --test diagnostic/stop-history/host-parser.test.mjs > "$RUNNER_TEMP/hd2065-parser.log" 2>&1; then echo 'pinned Host parser control failed'; exit 1; fi
          set +e
          node diagnostic/stop-history/controller.mjs > "$RUNNER_TEMP/hd2065-controller.log" 2>&1
          proof_exit=$?
          set -e
          node diagnostic/stop-history/report.mjs "$RUNNER_TEMP/hd2065-controller.log" "$proof_exit"
          test -f "$proof_dir/publication-ready"
          test -f "$proof_dir/unconfirmed.png"
          test -f "$proof_dir/reviewed.png"
          test -f "$proof_dir/manifest.json"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - name: Upload audited synthetic frames only
        if: steps.proof.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stop-history-synthetic-frames
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hd2065-private-frames/unconfirmed.png
            ${{ runner.temp }}/hd2065-private-frames/reviewed.png
            ${{ runner.temp }}/hd2065-private-frames/manifest.json
