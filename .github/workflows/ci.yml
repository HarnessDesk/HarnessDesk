name: Native front door diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Front door pointer observation
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check diagnostic source pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 8a516c02db0af454e3e5505c32d79580b88afe88
          test -z "$(git diff --name-only 8a516c02db0af454e3e5505c32d79580b88afe88 HEAD -- . ':!/.github/workflows/ci.yml' ':!/script/shots/shoot.mjs')"
          test -z "$(git status --porcelain)"
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test:ui-system:native
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: front-door-structural-diagnostic
          path: |
            output/native-ui-system/frames/front-door-structural.json
            output/native-ui-system/frames/front-door-failure.png
          if-no-files-found: ignore
          retention-days: 2
