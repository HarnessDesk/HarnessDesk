name: Native startup observation only

# Temporary diagnostic branch only. Never merge this workflow into a target.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-startup-observation:
    name: Native startup observation only
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record executable identity
        run: |
          node <<'JS'
          const {readFileSync} = require('node:fs');
          const {createHash} = require('node:crypto');
          const binary = require('./packages/desktop/node_modules/electron');
          console.log(JSON.stringify({node: process.version, platform: process.platform, arch: process.arch,
            electronVersion: require('./packages/desktop/node_modules/electron/package.json').version,
            electronSha256: createHash('sha256').update(readFileSync(binary)).digest('hex')}));
          JS
      - run: pnpm run build
      - run: pnpm test:ui-system:native
      - name: Retain synthetic startup diagnostics
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-startup-observation-only
          path: |
            output/native-ui-system/startup-diagnostics/
            output/native-ui-system/report.json
          retention-days: 1
          if-no-files-found: warn
