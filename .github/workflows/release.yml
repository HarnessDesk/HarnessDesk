name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.1)"
        required: true
        type: string
      dry_run:
        description: "Build and verify, but do not publish"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, and publish
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Everything the pre-commit gate runs, minus the Codex protocol drift
      # check, which needs a Codex installation the runner does not have.
      - name: Build
        run: pnpm run build

      - name: Tests
        run: |
          node --test "packages/*/dist/test/**/*.test.js"
          pnpm --filter @harnessdesk/ui run test
          pnpm --filter @harnessdesk/desktop run test

      - name: Layering rules
        run: pnpm run layering

      - name: Set version
        run: |
          node -e '
            const fs = require("node:fs")
            for (const path of ["package.json", "packages/desktop/package.json"]) {
              const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
              pkg.version = process.env.VERSION
              fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n")
            }
          '
        env:
          VERSION: ${{ inputs.version }}

      # electron-builder imports CSC_LINK into a keychain of its own and
      # destroys it the moment the build finishes — `app-builder-lib` does
      # `disposeOnBuildFinish(() => removeKeychain(keychainFile))`. Stapling
      # the DMGs runs after that and signs with a plain `codesign`, so on a
      # clean runner it found no identity at all and the release failed there.
      # It passed on the machine v0.1.0 was cut from only because that machine
      # keeps the identity in its login keychain.
      #
      # So the certificate also goes into a keychain of ours, which lasts as
      # long as the job. Purely additive: the build below still gets CSC_LINK
      # and still signs out of the keychain electron-builder makes for itself,
      # scoped with `--keychain`, so nothing about the signing path changes.
      #
      # `secrets` is not a context a step-level `if:` can read, so the skip is
      # inside the script — a fork's dry run has no certificate, and an
      # unsigned build is exactly what that run is for.
      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$CSC_LINK" ]; then
            echo "No MAC_CERTIFICATE_P12 configured. This build will be unsigned."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/harnessdesk-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE="$RUNNER_TEMP/signing-certificate.p12"

          # The secret holds the .p12 base64-encoded, which is also one of the
          # forms electron-builder takes in CSC_LINK.
          echo "$CSC_LINK" | base64 --decode > "$CERTIFICATE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Named for the cleanup step here, before anything else can fail: an
          # import that throws leaves a keychain behind, and one exported after
          # the import is one the cleanup step never hears about.
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$CERTIFICATE"

          # Without a partition list every `codesign` run stops at a UI prompt
          # that a runner has nobody to answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Added to the search list rather than made the default, and with the
          # existing list kept: `codesign --sign` searches the list, and
          # electron-builder puts its own keychain in front of ours for the
          # build and takes it back out when the build ends.
          #
          # Read line by line into a list rather than substituted unquoted.
          # `security list-keychains` prints one quoted path per line, and an
          # unquoted `$(...)` splits every one of them on whitespace — so a
          # keychain whose path contains a space becomes two arguments, and the
          # search list this writes is missing the keychain that was in it.
          EXISTING=()
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/^"//' -e 's/"$//')
            if [ -n "$line" ]; then EXISTING+=("$line"); fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" ${EXISTING[@]+"${EXISTING[@]}"}

          # Said here rather than discovered ten minutes into a build, and
          # asked twice, because "no valid identity" has two causes that want
          # two different fixes: the wrong certificate in the secret, or the
          # right one exported without the intermediate that chains it to an
          # Apple root. Only the second prints CSSMERR_TP_NOT_TRUSTED, and only
          # without `-v` — with it the identity simply is not listed at all.
          VALID="$(security find-identity -v -p codesigning "$KEYCHAIN")"
          echo "$VALID"
          case "$VALID" in
            *"Developer ID Application"*) exit 0 ;;
          esac

          PRESENT="$(security find-identity -p codesigning "$KEYCHAIN")"
          echo "$PRESENT"
          case "$PRESENT" in
            *"Developer ID Application"*)
              echo "::error::The Developer ID Application certificate imported but does not chain to a trusted root. Re-export the .p12 with its intermediate — Keychain Access includes the chain when the certificate is exported together with its private key." ;;
            *)
              echo "::error::MAC_CERTIFICATE_P12 carries no Developer ID Application certificate." ;;
          esac
          exit 1

      # `notarytool --key` takes a path — its own help reads "File system path
      # to the private key" — so the secret carrying the key has to become a
      # file before anything can submit with it. Passed straight through, as it
      # was, the API-key route reached `notarytool` with the key's text where a
      # filename belongs and failed there, which is the same shape of trap as
      # the one issue #2 opened on: a credential that satisfies every check
      # that only asks whether the name is set.
      #
      # The path is exported for the steps below, which is why the build step
      # no longer maps APPLE_API_KEY itself — a step-level `env:` would put the
      # key's text back in front of this path.
      - name: Write the App Store Connect key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_API_KEY" ]; then
            echo "No APPLE_API_KEY configured; notarization will take the Apple ID route."
            exit 0
          fi
          if [ -f "$APPLE_API_KEY" ]; then
            # Still exported. A step-level `env:` reaches only its own step, and
            # the build step below deliberately does not map APPLE_API_KEY — so
            # returning here without writing it out left the key set nowhere at
            # all, and a correctly configured path failed as "no credentials".
            echo "APPLE_API_KEY=$APPLE_API_KEY" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY already names a file; leaving it alone."
            exit 0
          fi

          KEY_FILE="$RUNNER_TEMP/apple-api-key.p8"
          # Whichever way the .p8 was put into the secret: its own text, or
          # base64 of it, the way the certificate beside it is stored.
          if printf '%s' "$APPLE_API_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPLE_API_KEY" > "$KEY_FILE"
          else
            printf '%s' "$APPLE_API_KEY" | base64 --decode > "$KEY_FILE" 2>/dev/null || true
          fi
          chmod 600 "$KEY_FILE"

          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_FILE"; then
            echo "::error::APPLE_API_KEY is neither an App Store Connect .p8 key nor base64 of one, and is not a path to a file."
            exit 1
          fi
          echo "APPLE_API_KEY=$KEY_FILE" >> "$GITHUB_ENV"
          echo "Wrote the App Store Connect key to $KEY_FILE"

      # Which script runs is decided by the credentials, not by `dry_run`.
      # `dist:notarized` refuses without them by design, so a fork — which has
      # no secrets — takes `dist` and produces the unsigned bundle that is the
      # whole point of a fork's run. They used to share `dist`, which passes
      # `-c.mac.notarize=false`: the job set every Apple credential and then
      # explicitly switched off the step that used them, and would have
      # published a signed-but-not-notarized build that Gatekeeper stops on
      # first launch.
      #
      # Keying on `dry_run` instead left the release path untested by
      # construction. Everything below `-c.mac.notarize=true` — preflight,
      # notarization, DMG signing, stapling, the manifest repair — ran for the
      # first time during a real release, on a workflow no pull request can
      # exercise because this file is `workflow_dispatch` only. That is how the
      # DMG stapling in issue #2 stayed broken through a release. A dry run on
      # this repository now does the whole thing and simply does not publish,
      # which costs a real notarization submission and roughly fifteen minutes
      # and buys the only rehearsal this workflow can have.
      #
      # `dist:notarized` also staples the DMGs and repairs `latest-mac.yml`.
      # electron-builder staples the .app and then builds a fresh DMG around
      # it, so the DMG Apple never saw carries no ticket of its own; that used
      # to be a step here, which meant a release cut by hand got it only if
      # somebody remembered the extra command.
      - name: Build signed app
        working-directory: packages/desktop
        run: |
          if [ -n "${CSC_LINK:-}" ]; then
            pnpm run dist:notarized
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "No signing certificate in this environment; building unsigned."
            pnpm run dist
          else
            # `Publish release` below is gated on dry_run alone, so an unsigned
            # build here would be uploaded as a release rather than stopped.
            # Choosing the script by credentials made that reachable: before,
            # a publishing run always took `dist:notarized` and its preflight
            # refused. This is that fail-closed behaviour, said out loud.
            echo "::error::A publishing run needs MAC_CERTIFICATE_P12. Refusing to publish an unsigned build."
            exit 1
          fi
        env:
          # Absent on a fork, which is what selects the unsigned build above;
          # electron-builder then produces an ad-hoc bundle rather than
          # failing, which is what a run that is never published wants.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_API_KEY is deliberately absent: the step above exported it as
          # the path to the .p8 it wrote, and a step-level `env:` here would
          # override that with the key's text again.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # After stapling, so the sums describe the bytes that ship.
      - name: Checksums
        working-directory: packages/desktop/release
        run: shasum -a 256 *.dmg *.zip > SHA256SUMS.txt || true

      - name: Report signature status
        working-directory: packages/desktop/release
        run: |
          for app in mac*/HarnessDesk.app; do
            [ -d "$app" ] || continue
            echo "== $app"
            # Reported rather than enforced: an unsigned dry-run build is a
            # legitimate outcome, and failing here would hide the real result.
            codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -5 || true
            spctl --assess --type execute --verbose "$app" 2>&1 | tail -3 || true
          done
          # The .app inside the build directory is not what anyone downloads.
          # The DMG is, and nothing here used to look at one: no signature, no
          # ticket, no Gatekeeper verdict on the container. `stapler validate`
          # is the offline question — whether a first launch works on a machine
          # that cannot reach Apple, which is the whole reason DMGs are stapled
          # at all. An unsigned build has none of it, and says so rather than
          # failing — which on this repository now means a fork's run, not a
          # dry run, since a dry run here signs, notarizes and staples too.
          for dmg in *.dmg; do
            [ -f "$dmg" ] || continue
            echo "== $dmg"
            codesign --verify --strict --verbose=2 "$dmg" 2>&1 | tail -3 || true
            xcrun stapler validate "$dmg" 2>&1 | tail -3 || true
            spctl --assess --type open --context context:primary-signature -v "$dmg" 2>&1 | tail -3 || true
          done

      - uses: actions/upload-artifact@v7
        with:
          name: HarnessDesk-${{ inputs.version }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.zip.blockmap
            packages/desktop/release/latest-mac.yml
            packages/desktop/release/SHA256SUMS.txt
          retention-days: 14

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          name: HarnessDesk ${{ inputs.version }}
          generate_release_notes: true
          # `latest-mac.yml` is the file electron-updater actually fetches,
          # and the zip blockmaps are what let it download a delta instead of
          # 150MB. Uploading the DMGs and zips without them publishes a
          # release the updater cannot read.
          #
          # Only the *zip* blockmaps: stapling rewrites each DMG after
          # packaging has already measured it, so the DMG blockmaps describe
          # bytes that no longer exist. `staple-dmgs.mjs` deletes them rather
          # than leave a file that lies; this glob is the second guard, for a
          # run where stapling did not happen.
          files: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.zip.blockmap
            packages/desktop/release/latest-mac.yml
            packages/desktop/release/SHA256SUMS.txt

      # They outlive the build by design; they should not outlive the job. A
      # hosted runner forgets both either way — a self-hosted one would not.
      - name: Remove the signing credentials
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/apple-api-key.p8" "$RUNNER_TEMP/signing-certificate.p12"
