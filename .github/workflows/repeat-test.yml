name: Repeat test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cookie-diagnostic:
    name: UI typecheck and desktop tests (cookie group diagnostic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 10.4.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build:node
      - name: UI typecheck
        run: pnpm --filter @harnessdesk/ui run typecheck
      - name: Desktop tests
        run: pnpm --filter @harnessdesk/desktop run test
      - name: Native browser cookie persistence
        run: xvfb-run -a pnpm --filter @harnessdesk/desktop run test:cookie
