version: 2
name: Fix and review
description: One fixer, three reviewers, and the merge stays yours.
inputs:
  work:
    label: What to fix
    default: The issue or the change to make
roles:
  fixer:
    kind: agent
    uses: [implementer]
    grant: publish
    independentOf: []
  reviewer:
    kind: agent
    uses: [code-reviewer]
    count: 3
    grant: read
    independentOf: []
  referee:
    kind: person
    outcomes: [merged, dropped]
seed:
  role: fixer
  title: "{{work}}"
  detail: Open a pull request for it when it is done and working.
rules:
  - id: review-it
    on: fixer
    when: { every: [published] }
    then:
      role: reviewer
      title: Review the pull request
      detail: Review the pull request the fixer's context package names independently.
  # A request for changes takes precedence over approvals.
  - id: fix-again
    on: reviewer
    when: { any: [request-changes] }
    then:
      role: fixer
      title: Answer the reviews
      detail: Answer every finding, push to the same branch, and publish again.
  - id: hand-to-the-person
    on: reviewer
    when: { every: [approve] }
    then:
      role: referee
      title: Merge it — every reviewer approved
      detail: Merging is yours; no agent in this flow may do it.
messaging: board-only
wait: 240
layout:
  positions:
    fixer: { x: 40, y: 40 }
    reviewer: { x: 300, y: 40 }
    referee: { x: 560, y: 40 }
