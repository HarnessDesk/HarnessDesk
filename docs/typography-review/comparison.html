<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typography review — three measured maps</title><style>body{font:14px system-ui;margin:24px;background:#fafafa;color:#222}header{position:sticky;top:0;background:#fafafa;padding:12px 0}main{display:flex;gap:20px;overflow:auto}figure{margin:0;flex:none}img{display:block;width:700px;border:1px solid #ccc}figcaption{padding:8px 0}label{margin-right:24px}a{color:#264bb2}</style><header><h1>Typography review</h1><p>Fixture-only captures of mounted screens. Choose a theme and zoom; compare the rail names with the first chat sender and body.</p><label>Theme <select id="theme"><option>light</option><option>dark</option></select></label><label>Zoom <input id="zoom" type="range" min="25" max="100" value="50"> <output>50%</output></label><a href="REPORT.md">Read the report</a></header><main><figure><figcaption>Current — navigation 13/400; member 14/600</figcaption><img data-map="current" src="current-light.png" alt="Current map"></figure><figure><figcaption>Recommendation — navigation 13/400; member 14/500</figcaption><img data-map="recommendation" src="recommendation-light.png" alt="Recommended map"></figure><figure><figcaption>Alternative — rail members 14/600; sender 14/600</figcaption><img data-map="alternative" src="alternative-light.png" alt="Promoted rail members"></figure></main><script>theme.onchange=()=>document.querySelectorAll('img').forEach(img=>img.src=img.dataset.map+'-'+theme.value+'.png');zoom.oninput=()=>{document.querySelectorAll('img').forEach(img=>img.style.width=(1400*zoom.value/100)+'px');document.querySelector('output').textContent=zoom.value+'%'};</script></html>
