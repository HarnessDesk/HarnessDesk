<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src 'self'; script-src 'unsafe-inline'" />
<title>About HarnessDesk</title>
<link rel="stylesheet" href="about-foundation.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font: var(--hd-text-sm)/1.4 var(--hd-font-family);
    color: var(--hd-foreground); background: var(--hd-background);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; user-select: none; cursor: default;
    -webkit-app-region: drag;
  }
  /* The geometry is the native app-icon boundary; its visual decisions still
     resolve through the generated renderer foundation beside this file. */
  .tile {
    width: 104px; height: 104px; border-radius: var(--hd-radius-lg);
    background: linear-gradient(180deg, var(--hd-card), var(--hd-muted));
    box-shadow: var(--hd-shadow-lg), 0 0 0 1px var(--hd-border);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
  }
  .mark {
    width: 80px; height: 80px; background-color: var(--hd-foreground);
    -webkit-mask: url(mark.svg) center / contain no-repeat; mask: url(mark.svg) center / contain no-repeat;
  }
  h1 { font-size: var(--hd-heading); font-weight: 600; margin: 0 0 6px; letter-spacing: -0.01em; }
  .version { color: var(--hd-muted-foreground); margin: 0 0 14px; }
  .runtime { color: var(--hd-muted-foreground); font-size: var(--hd-text-xs); margin: 0; }
  .legal { color: var(--hd-muted-foreground); font-size: var(--hd-text-xs); margin: 18px 0 0; }
</style>
</head>
<body>
  <div class="tile"><div class="mark" role="img" aria-label="HarnessDesk"></div></div>
  <h1>HarnessDesk</h1>
  <p class="version" id="version">Version</p>
  <p class="runtime" id="runtime"></p>
  <p class="legal">MIT License · © 2026 HarnessDesk contributors</p>
  <script>
    const q = new URLSearchParams(location.search)
    const appearance = [
      ['palette', 'hdPalette'],
      ['accent', 'hdAccent'],
      ['corners', 'hdCorners'],
      ['interface', 'hdInterface'],
    ]
    for (const [query, data] of appearance) {
      const value = q.get(query)
      if (value) document.documentElement.dataset[data] = value
    }
    const v = q.get('version') ?? ''
    document.getElementById('version').textContent = `Version ${v}`
    const bits = []
    if (q.get('electron')) bits.push(`Electron ${q.get('electron')}`)
    if (q.get('chrome')) bits.push(`Chromium ${q.get('chrome')}`)
    document.getElementById('runtime').textContent = bits.join(' · ')
    addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close() })
  </script>
</body>
</html>
