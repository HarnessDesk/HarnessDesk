version: 2
name: "Side by side"
summary: "Two agents, one task; a judge picks, you merge."
description: "One task, two isolated agents; optional checks, then a judge picks, then a person merges."
inputs:
  task:
    label: "Task"
roles:
  competitor:
    kind: agent
    uses: [implementer]
    count: 2
    isolate: true
    grant: edit
    independentOf: []
  judge:
    kind: agent
    uses: [judge]
    grant: read
    independentOf: [competitor]
  referee:
    kind: person
    outcomes: [merged]
complete: { referee: [merged] }
seed: { role: competitor, title: "{{task}}" }
rules:
  - id: to-judge
    on: competitor
    then: { role: judge, title: "Pick the best attempt" }
  - id: to-referee
    on: judge
    when: { every: [picked], evidence: [{ review: picked }] }
    then: { role: referee, title: "Merge the picked change", detail: "Merge exactly {{evidence.review.at}}, the revision the judge picked." }
messaging: board-only
# How far a run may go before it stops for a person: closed rounds in all, and
# closed rounds in a row that brought no new evidence. Raise it for longer loops.
budget: { rounds: 4, without-progress: 2 }
wait: 240
layout: {"race":"competitor","frontDoor":{"order":3,"contexts":["project"]}}
