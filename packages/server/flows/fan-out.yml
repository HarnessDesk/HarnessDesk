version: 2
name: "Fan-out review"
description: "Several reviewers read the same change at once; every one of them has to approve before it ships."
inputs:
  task:
    label: "Task"
roles:
  build:
    kind: agent
    uses: [implementer]
    grant: edit
    independentOf: []
  review:
    kind: agent
    uses: [code-reviewer]
    count: 3
    grant: read
    independentOf: [build]
  ship:
    kind: person
    outcomes: [shipped]
seed: { role: build, title: "{{task}}" }
rules:
  - id: to-review
    on: build
    then: { role: review, title: "Review the change" }
  - id: to-ship
    on: review
    when: { every: [approve] }
    then: { role: ship, title: "Ship it — every reviewer approved" }
messaging: board-only
wait: 240
