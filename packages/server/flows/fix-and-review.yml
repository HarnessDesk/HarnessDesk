version: 2
name: Write and review
summary: One writes, a fresh reviewer reads, up to three rounds.
description: One writer and a fresh independent reviewer, with at most three reviews before a person takes over.
inputs:
  work:
    label: Task
roles:
  fixer:
    kind: agent
    uses: [implementer]
    grant: publish
    independentOf: []
  reviewer:
    kind: agent
    uses: [code-reviewer]
    grant: read
    independentOf: [fixer]
  referee:
    kind: person
    outcomes: [merged, dropped]
seed:
  role: fixer
  title: "{{work}}"
  detail: Open a pull request for it when it is done and working.
rules:
  - id: review-it
    on: fixer
    when: { every: [published] }
    then:
      role: reviewer
      title: Review the pull request
      detail: Review the pull request the fixer's context package names independently.
  # A request for changes takes precedence over approvals.
  - id: fix-again
    on: reviewer
    when: { any: [request-changes] }
    then:
      role: fixer
      title: Answer the reviews
      detail: Answer every finding, push to the same branch, and publish again.
  - id: hand-to-the-person
    on: reviewer
    when: { every: [approve], evidence: [{ review: approve }] }
    then:
      role: referee
      title: Merge it — every reviewer approved
      detail: Merging is yours; no agent in this flow may do it.
messaging: board-only
# Three writes and three reviews, with one final repair or handoff.
budget: { rounds: 7, without-progress: 2 }
wait: 240
layout:
  frontDoor: { order: 0, contexts: [project] }
  positions:
    fixer: { x: 40, y: 40 }
    reviewer: { x: 300, y: 40 }
    referee: { x: 560, y: 40 }
