version: 2
name: "Mechanical contest"
summary: "Two attempts; optional project checks, then you choose."
description: "Two isolated attempts, optional project checks, then a person chooses and merges one."
inputs:
  task:
    label: "Task"
roles:
  competitor:
    kind: agent
    uses: [implementer]
    count: 2
    isolate: true
    grant: edit
    independentOf: []
  referee:
    kind: person
    outcomes: [merged, dropped]
complete: { referee: [merged, dropped] }
seed: { role: competitor, title: "{{task}}" }
rules:
  - id: to-person
    on: competitor
    then: { role: referee, title: "Choose and merge an attempt" }
messaging: board-only
# How far a run may go before it stops for a person: closed rounds in all, and
# closed rounds in a row that brought no new evidence. Raise it for longer loops.
budget: { rounds: 3, without-progress: 2 }
wait: 240
layout: {"frontDoor":{"contexts":["project"]}}
