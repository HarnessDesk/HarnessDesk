version: 2
name: "Comparison with a person judge"
description: "One task, two isolated agents; a check on each, then a person picks, then a person merges."
inputs:
  task:
    label: "Task"
roles:
  competitor:
    kind: agent
    uses: [implementer]
    count: 2
    isolate: true
    grant: edit
    independentOf: []
  verify:
    kind: check
    run: "test -s attempt.txt"
    exits:
      "0": pass
    otherwise: fail
    timeout: 900
  judge:
    kind: person
    outcomes: [picked]
  referee:
    kind: person
    outcomes: [merged]
complete: { referee: [merged] }
seed: { role: competitor, title: "{{task}}" }
rules:
  - id: to-verify
    on: competitor
    then: { role: verify, title: "Check the attempt" }
  - id: to-judge
    on: verify
    when: { any: [pass] }
    then: { role: judge, title: "Pick the best attempt" }
  - id: to-referee
    on: judge
    when: { every: [picked], evidence: [{ review: picked }] }
    then: { role: referee, title: "Merge the picked change", detail: "Merge exactly {{evidence.review.at}}, the revision the judge picked." }
messaging: board-only
budget: { rounds: 4, without-progress: 2 }
wait: 240
