<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lantern Hop</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1a1029}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const FONT = "ui-rounded, 'SF Pro Rounded', 'Nunito', 'Avenir Next', system-ui, sans-serif";
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

// ---------- deterministic randomness ----------
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hash(i, s) {
  let h = (Math.imul(i | 0, 374761393) + Math.imul(s | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, s) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return hash(i, s) * (1 - u) + hash(i + 1, s) * u;
}
let fx = mulberry32(0xC0FFEE); // effects rng

// ---------- viewport ----------
let W = 0, H = 0, DPR = 1, S = 1, VW = 520, VH = 440, GY = 273, WY = 326, PX = 120;
function resize() {
  const w = cv.clientWidth || innerWidth, h = cv.clientHeight || innerHeight;
  const d = Math.min(window.devicePixelRatio || 1, 2);
  if (w === W && h === H && d === DPR) return;
  W = w; H = h; DPR = d;
  cv.width = Math.max(1, Math.round(w * d));
  cv.height = Math.max(1, Math.round(h * d));
  S = Math.min(H / 440, W / 520);
  VW = W / S; VH = H / S;
  GY = VH * 0.62;               // play happens above this line; the band below is decoration
  WY = GY + (VH - GY) * 0.3;    // waterline under the earthen bank
  PX = clamp(VW * 0.24, 92, 240);
}

// ---------- physics constants (world units) ----------
const G = 2500, V0 = 820, AIR = 2 * V0 / G, APEX = V0 * V0 / (2 * G);
const R = 17, LEG = 7, HC = R + LEG;
const speedAt = d => 290 + 230 * (1 - Math.exp(-d / 30000));

// ---------- palettes ----------
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PALS = [
  { top:'#241a4a', mid:'#7d3f78', bot:'#f59a62', orb:'#ffe2ad', halo:'#ff9a5c', far:'#8a5a8f', mtn:'#5a3a73', hill:'#3a2656', tree:'#22163a', ground:'#1a1029', rim:'#6a4278', fog:'#f1946f', cloud:'#ffb48e', night:.22 },
  { top:'#070b24', mid:'#17245a', bot:'#3e5590', orb:'#f3f0d6', halo:'#7d9ad8', far:'#35437a', mtn:'#24305c', hill:'#182143', tree:'#0e132b', ground:'#0a0d1f', rim:'#2f3f70', fog:'#5570b0', cloud:'#6278b4', night:1 },
  { top:'#1b3358', mid:'#b8637f', bot:'#ffcf9a', orb:'#fff3c9', halo:'#ffb27a', far:'#9b6f95', mtn:'#6a4a78', hill:'#44305e', tree:'#271a3e', ground:'#1d1330', rim:'#76508a', fog:'#ffb894', cloud:'#ffd2b4', night:.08 },
].map(p => { const o = {}; for (const k in p) o[k] = typeof p[k] === 'string' ? hex(p[k]) : p[k]; return o; });
const rgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function palAt(c, cycle) {
  if (!cycle) return PALS[0];
  const ph = (c / 40) % 3, i = Math.floor(ph), f = smooth(clamp((ph - i - 0.62) / 0.38, 0, 1));
  const a = PALS[i], b = PALS[(i + 1) % 3], o = {};
  for (const k in a) o[k] = typeof a[k] === 'number' ? lerp(a[k], b[k], f) : mixc(a[k], b[k], f);
  return o;
}

// ---------- state ----------
let stage = 3;
let clock = 0, bgCam = 0, runs = 0, flash = 0, humanUntil = -1, jumpBuf = 0, pendingPress = false;
let run, P;
const parts = [];
const scarf = [];
for (let i = 0; i < 9; i++) scarf.push({ x: 0, y: 0, px: 0, py: 0 });
let scarfInit = false;

function newRun() {
  runs++;
  run = {
    rng: mulberry32((0x5EED1234 ^ Math.imul(runs, 0x9E3779B1)) >>> 0),
    cam: 0, t: 0, sp: speedAt(0), flies: 0, score: 0,
    obs: [], items: [], targets: [], genX: 0, pop: 0,
  };
  run.genX = Math.max(VW, 520) + 60;
  P = { y: 0, vy: 0, ground: true, coyote: 0, airT: 0, sq: 0, sqv: 0, rot: 0, flip: false, jumps: 0,
        phase: 0, step: 0, happy: 0, glow: 0, ax: 0, axv: 0 };
}

function arc(cx, sp, n) {
  for (let k = 0; k < n; k++) {
    const dx = (k - (n - 1) / 2) * 34, t = dx / sp;
    run.items.push({ x: cx + dx, y: APEX - G / 2 * t * t + HC, taken: false, ph: k * 0.7 + cx * 0.01 });
  }
}

function gen() {
  const r = run.rng;
  while (run.genX < run.cam + VW + 420) {
    const x = run.genX, sp = speedAt(x), jd = sp * AIR, roll = r();
    if (roll < 0.64) {
      const tr = r(), type = tr < 0.42 ? 0 : tr < 0.72 ? 1 : 2;
      let w, h;
      if (type === 0) { w = 40 + r() * 46; h = 24 + r() * 16; }
      else if (type === 1) { w = 32 + r() * 8; h = 46 + r() * 16; }
      else { w = 44 + r() * 8; h = 26 + r() * 6; }
      const cx = x + w / 2;
      run.obs.push({ x, w, h, type, s: (r() * 1e6) | 0, near: 0 });
      run.targets.push(cx);
      if (r() < 0.62) arc(cx, sp, r() < 0.5 ? 3 : 5);
      run.genX = x + w + jd * (1.18 + r() * 0.9) + (r() < 0.2 ? sp * 0.5 : 0);
    } else if (roll < 0.82) {
      const n = 4 + ((r() * 3) | 0);
      for (let i = 0; i < n; i++) run.items.push({ x: x + i * 32, y: HC, taken: false, ph: i * 0.9 });
      run.genX = x + n * 32 + jd * 0.6 + 30;
    } else {
      const cx = x + jd * 0.5;
      arc(cx, sp, 5);
      run.targets.push(cx);
      run.genX = x + jd * 1.45 + sp * 0.25;
    }
  }
}

// ---------- particles ----------
function spawn(o) { if (parts.length < 400) parts.push(o); }
function dust(x, y, n, power) {
  for (let i = 0; i < n; i++) {
    const a = Math.PI + fx() * Math.PI;
    spawn({ t: 'dust', x: x + (fx() - .5) * 10, y: y - 2, vx: Math.cos(a) * (40 + fx() * 90) * power - run.sp * 0.15,
      vy: Math.sin(a) * (20 + fx() * 50) * power, g: -30, life: 0, max: .45 + fx() * .35, size: 3 + fx() * 4 });
  }
}
function sparks(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = fx() * TAU, s = 60 + fx() * 180;
    spawn({ t: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 160, life: 0, max: .35 + fx() * .4, size: 1.2 + fx() * 2, col });
  }
}

// ---------- jumping / sim ----------
function doJump() {
  P.vy = V0; P.ground = false; P.coyote = 0; P.airT = 0; P.jumps++;
  P.flip = P.jumps % 3 === 0;
  P.sqv = 7;
  dust(run.cam + PX, GY, 5, 0.6);
}

function crash() {
  const wx = run.cam + PX, wy = GY - P.y - HC;
  sparks(wx, wy, 34, 1);
  for (let i = 0; i < 12; i++) spawn({ t: 'dust', x: wx + (fx() - .5) * 20, y: wy + (fx() - .5) * 20,
    vx: (fx() - .5) * 200, vy: (fx() - .5) * 200, g: -20, life: 0, max: .6 + fx() * .4, size: 5 + fx() * 6 });
  spawn({ t: 'ring', x: wx, y: wy, vx: 0, vy: 0, g: 0, life: 0, max: .5, size: 70 });
  const shift = run.cam;
  for (const p of parts) p.x -= shift;
  flash = 1;
  newRun();
}

function nextTarget(pwx) {
  const T = run.targets;
  while (T.length && T[0] < pwx - 60) T.shift();
  for (let i = 0; i < T.length; i++) if (T[i] > pwx - 8) return T[i];
  return null;
}

function step(dt) {
  clock += dt;
  const r = run;
  const sp = speedAt(r.cam);
  r.sp = sp; r.cam += sp * dt; bgCam += sp * dt; r.t += dt;
  gen();
  const pwx = r.cam + PX;

  if (pendingPress) { pendingPress = false; humanUntil = clock + 4; jumpBuf = 0.14; }
  const human = clock < humanUntil;
  let want = false;
  if (jumpBuf > 0) { jumpBuf -= dt; if (P.ground || P.coyote > 0) { want = true; jumpBuf = 0; } }
  if (!human && P.ground) {
    const tg = nextTarget(pwx);
    if (tg !== null) { const d = tg - pwx; if (d <= sp * AIR / 2 && d > -8) want = true; }
  }
  if (want && (P.ground || P.coyote > 0)) doJump();

  if (!P.ground) {
    P.vy -= G * dt; P.y += P.vy * dt; P.airT += dt;
    if (P.y <= 0) {
      P.y = 0; P.vy = 0; P.ground = true; P.rot = 0; P.sqv = -7.5;
      dust(pwx, GY, 8, 1);
    }
  }
  // squash spring
  const target = P.ground ? 0 : clamp(P.vy / V0, -1, 1) * 0.12;
  P.sqv += ((target - P.sq) * 320 - P.sqv * 15) * dt;
  P.sq += P.sqv * dt;
  // rotation
  if (!P.ground) {
    P.rot = P.flip ? easeIO(clamp(P.airT / (AIR * 0.92), 0, 1)) * TAU : -P.vy / V0 * 0.16;
  } else P.rot *= 0.8;
  // antenna spring (lags vertical motion)
  P.axv += ((-P.vy * 0.006 - P.ax) * 220 - P.axv * 9) * dt;
  P.ax += P.axv * dt;
  // run cycle
  if (P.ground) {
    P.phase += sp * dt / 24;
    const st = Math.floor(P.phase / Math.PI);
    if (st !== P.step) { P.step = st; if (fx() < 0.6) dust(pwx - 4, GY, 1, 0.35); }
  }
  P.happy = Math.max(0, P.happy - dt);
  P.glow = Math.max(0, P.glow - dt * 1.4);
  r.pop = Math.max(0, r.pop - dt * 4);
  if (fx() < dt * 18) spawn({ t: 'ember', x: pwx - 10 + (fx() - .5) * 8, y: GY - P.y - HC + 6, vx: -40 - fx() * 40, vy: -20 - fx() * 40, g: -40, life: 0, max: .6 + fx() * .6, size: 1 + fx() * 1.6 });

  // collisions
  const cy = P.y + HC, cr = R * 0.78;
  for (const o of r.obs) {
    const top = o.h + (o.type === 2 ? 4 : 0);
    o.near = Math.abs(o.x + o.w / 2 - pwx);
    if (o.x > pwx + R || o.x + o.w < pwx - R) continue;
    const nx = clamp(pwx, o.x + 3, o.x + o.w - 3), ny = clamp(cy, 0, top - 3);
    if ((pwx - nx) ** 2 + (cy - ny) ** 2 < cr * cr) { crash(); return; }
  }
  for (const it of r.items) {
    if (it.taken) continue;
    if (Math.abs(it.x - pwx) < 26 && Math.abs(it.y - cy) < 28) {
      it.taken = true; r.flies++; r.pop = 1; P.happy = 0.4; P.glow = 1;
      const sy = GY - it.y;
      sparks(it.x, sy, 10, 0);
      spawn({ t: 'ring', x: it.x, y: sy, vx: 0, vy: 0, g: 0, life: 0, max: .4, size: 28 });
    }
  }
  r.obs = r.obs.filter(o => o.x + o.w > r.cam - 120);
  r.items = r.items.filter(i => i.x > r.cam - 120);
  r.score = Math.floor(r.cam / 10) + r.flies * 25;

  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.vx *= (1 - 2.2 * dt); p.vy *= (1 - 1.2 * dt);
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  flash = Math.max(0, flash - dt * 3.2);

  // scarf (screen space, verlet)
  const ang = P.rot, sx = 1 - P.sq * 0.55, sy = 1 + P.sq;
  const ox = -R * 0.55 * sx, oy = HC + (R * 0.42 - HC) * sy; // relative to body center before rotation
  const ccx = PX, ccy = GY - P.y - HC;
  const axp = ccx + ox * Math.cos(ang) - (oy - 0) * Math.sin(ang);
  const ayp = ccy + ox * Math.sin(ang) + (oy - 0) * Math.cos(ang);
  if (!scarfInit) { scarfInit = true; scarf.forEach((p, i) => { p.x = p.px = axp - i * 5; p.y = p.py = ayp; }); }
  scarf[0].x = axp; scarf[0].y = ayp;
  for (let i = 1; i < scarf.length; i++) {
    const p = scarf[i];
    const vx = (p.x - p.px) * 0.92, vy = (p.y - p.py) * 0.92;
    p.px = p.x; p.py = p.y;
    p.x += vx - 1500 * dt * dt;
    p.y += vy + (260 + Math.sin(clock * 15 - i * 0.9) * 900) * dt * dt;
  }
  for (let k = 0; k < 3; k++) for (let i = 1; i < scarf.length; i++) {
    const a = scarf[i - 1], b = scarf[i];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, L = 5.2;
    const m = (d - L) / d;
    if (i === 1) { b.x -= dx * m; b.y -= dy * m; }
    else { a.x += dx * m * .5; a.y += dy * m * .5; b.x -= dx * m * .5; b.y -= dy * m * .5; }
  }
  scarf[0].x = axp; scarf[0].y = ayp;
}

// ---------- drawing: background ----------
function ridge(factor, base, amp, freq, seed, color, sharp) {
  const off = bgCam * factor;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(-10, VH + 10);
  for (let x = -10; x <= VW + 16; x += 6) {
    const wx = (x + off) * freq;
    let n = vnoise(wx, seed) * .62 + vnoise(wx * 2.3, seed + 7) * .26 + vnoise(wx * 5.7, seed + 13) * .12;
    if (sharp) n = 1 - Math.abs(n * 2 - 1) * .85;
    ctx.lineTo(x, base - amp * n);
  }
  ctx.lineTo(VW + 16, VH + 10);
  ctx.closePath();
  ctx.fill();
}
function hillY(x, off, base) {
  const wx = (x + off) * 0.006;
  return base - 46 * (vnoise(wx, 31) * .7 + vnoise(wx * 2.7, 37) * .3);
}
function fogBand(y0, y1, col, a) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, rgb(col, 0)); g.addColorStop(1, rgb(col, a));
  ctx.fillStyle = g; ctx.fillRect(-2, y0, VW + 4, y1 - y0);
}

function drawSky(pal, full) {
  const g = ctx.createLinearGradient(0, 0, 0, GY);
  g.addColorStop(0, rgb(pal.top)); g.addColorStop(0.55, rgb(pal.mid)); g.addColorStop(1, rgb(pal.bot));
  ctx.fillStyle = g; ctx.fillRect(-2, -2, VW + 4, GY + 4);
  if (!full) return;
  // stars
  const n = pal.night;
  if (n > 0.05) {
    ctx.fillStyle = '#fff8e8';
    for (let i = 0; i < 110; i++) {
      const x = ((hash(i, 3) * (VW + 60) - bgCam * 0.01) % (VW + 60) + VW + 60) % (VW + 60) - 30;
      const y = hash(i, 4) * GY * 0.72;
      const a = n * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(clock * (1 + hash(i, 5) * 3) + i))) * (1 - y / (GY * .9));
      const s = 0.5 + hash(i, 6) * 1.3;
      ctx.globalAlpha = a; ctx.fillRect(x, y, s, s);
    }
    ctx.globalAlpha = 1;
    // shooting star
    const k = Math.floor(clock / 7), ph = (clock / 7) - k;
    if (hash(k, 9) < 0.7 && ph < 0.12) {
      const u = ph / 0.12, sx0 = VW * (0.3 + hash(k, 10) * 0.6), sy0 = GY * (0.05 + hash(k, 11) * 0.25);
      const x = sx0 - u * 160, y = sy0 + u * 70;
      const gg = ctx.createLinearGradient(x, y, x + 60, y - 26);
      gg.addColorStop(0, rgb([255, 250, 230], n * (1 - u))); gg.addColorStop(1, rgb([255, 250, 230], 0));
      ctx.strokeStyle = gg; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 60, y - 26); ctx.stroke();
    }
  }
  // orb
  const ox = VW * 0.7, oy = GY * 0.4 + 6, orr = clamp(GY * 0.12, 28, 60);
  ctx.globalCompositeOperation = 'lighter';
  let hg = ctx.createRadialGradient(ox, oy, orr * 0.6, ox, oy, orr * 5);
  hg.addColorStop(0, rgb(pal.halo, 0.45)); hg.addColorStop(0.4, rgb(pal.halo, 0.12)); hg.addColorStop(1, rgb(pal.halo, 0));
  ctx.fillStyle = hg; ctx.fillRect(ox - orr * 5, oy - orr * 5, orr * 10, orr * 10);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgb(pal.orb);
  ctx.beginPath(); ctx.arc(ox, oy, orr, 0, TAU); ctx.fill();
  // moon shading at night
  if (n > 0.4) {
    ctx.fillStyle = rgb(pal.top, (n - 0.4) * 0.12);
    for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(ox + (hash(i, 21) - .5) * orr, oy + (hash(i, 22) - .5) * orr, orr * (0.12 + hash(i, 23) * 0.18), 0, TAU); ctx.fill(); }
  }
  // clouds: long paper strips
  for (let i = 0; i < 7; i++) {
    const span = VW + 400;
    const x = (((hash(i, 41) * span - bgCam * 0.03 - clock * (4 + hash(i, 42) * 6)) % span) + span) % span - 200;
    const y = GY * (0.18 + hash(i, 43) * 0.42);
    const w = 90 + hash(i, 44) * 160, h = 7 + hash(i, 45) * 9;
    ctx.fillStyle = rgb(pal.cloud, 0.22 + hash(i, 46) * 0.2);
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.quadraticCurveTo(x + w * 0.15, y - h * 0.6, x + w * 0.35, y + h * 0.1);
    ctx.quadraticCurveTo(x + w * 0.55, y - h * 1.3, x + w * 0.75, y + h * 0.2);
    ctx.quadraticCurveTo(x + w * 0.9, y - h * 0.3, x + w, y + h);
    ctx.closePath(); ctx.fill();
  }
}

function drawWhale(pal) {
  const per = 58, ph = (clock + per - 3) % per, dur = 38;
  if (ph > dur) return;
  const u = ph / dur;
  const s = clamp(GY / 340, 0.75, 1.25) * 0.85;
  const x = VW + 260 * s - u * (VW + 560 * s);
  const y = Math.max(GY * 0.3 + 20, 100 * s) + Math.sin(clock * 0.6) * 8;
  const body = mixc(pal.far, pal.cloud, 0.25);
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(clock * 0.6 + 1) * 0.04);
  const tail = Math.sin(clock * 1.3) * 0.28;
  // flukes
  ctx.save(); ctx.translate(150, -8); ctx.rotate(tail);
  ctx.fillStyle = rgb(body, 0.92);
  ctx.beginPath(); ctx.moveTo(0, 0);
  ctx.quadraticCurveTo(20, -30, 46, -34); ctx.quadraticCurveTo(30, -10, 36, 0);
  ctx.quadraticCurveTo(30, 10, 46, 30); ctx.quadraticCurveTo(20, 26, 0, 0); ctx.fill();
  ctx.restore();
  ctx.fillStyle = rgb(body, 0.92);
  ctx.beginPath();
  ctx.moveTo(-104, 2);
  ctx.bezierCurveTo(-104, -40, -30, -52, 30, -34);
  ctx.bezierCurveTo(80, -20, 120, -12, 154, -10);
  ctx.lineTo(154, -4);
  ctx.bezierCurveTo(110, 4, 60, 34, -20, 34);
  ctx.bezierCurveTo(-80, 34, -104, 20, -104, 2);
  ctx.fill();
  // belly
  ctx.fillStyle = rgb(mixc(body, [255, 230, 210], 0.25), 0.9);
  ctx.beginPath(); ctx.moveTo(-100, 10);
  ctx.bezierCurveTo(-70, 30, 0, 38, 60, 18);
  ctx.bezierCurveTo(10, 28, -60, 26, -100, 10); ctx.fill();
  ctx.strokeStyle = rgb(body, 0.7); ctx.lineWidth = 1.2;
  for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(-88 + i * 6, 14 + i * 2.4); ctx.quadraticCurveTo(-30, 30 + i * 1.5, 30 + i * 4, 20 + i * 0.5); ctx.stroke(); }
  // fin
  ctx.save(); ctx.translate(-30, 20); ctx.rotate(0.5 + Math.sin(clock * 1.3 + 1) * 0.3);
  ctx.fillStyle = rgb(mixc(body, pal.top, 0.2), 0.95);
  ctx.beginPath(); ctx.ellipse(18, 0, 22, 6, 0, 0, TAU); ctx.fill(); ctx.restore();
  // eye
  ctx.fillStyle = rgb(pal.top, 0.9);
  ctx.beginPath(); ctx.arc(-74, -2, 2.6, 0, TAU); ctx.fill();
  // glowing freckles
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 9; i++) {
    const px = -60 + i * 22, py = -34 + Math.abs(i - 3.5) * 2.8 + hash(i, 77) * 6;
    const a = 0.4 + 0.4 * Math.sin(clock * 2 + i);
    const gg = ctx.createRadialGradient(px, py, 0, px, py, 7);
    gg.addColorStop(0, `rgba(255,240,190,${a})`); gg.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.fillStyle = gg; ctx.fillRect(px - 7, py - 7, 14, 14);
  }
  // spout of stars
  const sp = (clock * 0.5) % 1;
  for (let i = 0; i < 6; i++) {
    const q = (sp + i / 6) % 1;
    const px = -40 + Math.sin(i * 2.1) * q * 18, py = -46 - q * 40;

}

function drawHills(pal, full) {
  const off = bgCam * 0.3, base = GY - 22;
  ctx.fillStyle = rgb(pal.hill);
  ctx.beginPath(); ctx.moveTo(-10, VH + 10);
  for (let x = -10; x <= VW + 16; x += 6) ctx.lineTo(x, hillY(x, off, base));
  ctx.lineTo(VW + 16, VH + 10); ctx.fill();
  // pines
  const sp = 22, i0 = Math.floor((off - 30) / sp), i1 = Math.floor((off + VW + 30) / sp);
  for (let i = i0; i <= i1; i++) {
    if (hash(i, 51) < 0.42) continue;
    const x = i * sp - off + hash(i, 52) * 12;
    const y = hillY(x, off, base) + 3;
    const h = 16 + hash(i, 53) * 26, w = h * 0.36;
    ctx.beginPath();
    ctx.moveTo(x, y - h);
    for (let t = 1; t <= 3; t++) {
      const yy = y - h + h * t / 3, ww = w * (0.45 + t * 0.2);
      ctx.lineTo(x + ww, yy); ctx.lineTo(x + ww * 0.45, yy - h * 0.08);
    }
    for (let t = 3; t >= 1; t--) {
      const yy = y - h + h * t / 3, ww = w * (0.45 + t * 0.2);
      ctx.lineTo(x - ww * 0.45, yy - h * 0.08); ctx.lineTo(x - ww, yy);
    }
    ctx.closePath(); ctx.fill();
  }
  if (full) {
    // little glowing windows of a hillside village
    const vs = 360, j0 = Math.floor((off - 40) / vs), j1 = Math.floor((off + VW + 40) / vs);
    for (let j = j0; j <= j1; j++) {
      if (hash(j, 61) < 0.5) continue;
      const x = j * vs - off + hash(j, 62) * 120, y = hillY(x, off, base) + 6;
      ctx.fillStyle = rgb(pal.hill);
      ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x - 9, y - 12); ctx.lineTo(x, y - 20); ctx.lineTo(x + 9, y - 12); ctx.lineTo(x + 9, y); ctx.fill();
      ctx.fillStyle = `rgba(255,200,110,${0.6 + 0.3 * Math.sin(clock * 3 + j)})`;
      ctx.fillRect(x - 3, y - 10, 5, 5);
    }
  }
}

function drawMotes() {
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 28; i++) {
    const span = VW + 60;
    const x = (((hash(i, 71) * span * 2 - bgCam * (0.35 + hash(i, 72) * 0.2) + Math.sin(clock * 0.7 + i) * 24) % span) + span) % span - 30;
    const y = GY - 30 - hash(i, 73) * GY * 0.42 + Math.sin(clock * 1.3 + i * 2) * 14;
    const a = 0.25 + 0.5 * Math.max(0, Math.sin(clock * (1.5 + hash(i, 74) * 2) + i * 3));
    const r = 5 + hash(i, 75) * 4;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(255,236,150,${a})`); g.addColorStop(0.3, `rgba(255,200,90,${a * 0.4})`); g.addColorStop(1, 'rgba(255,170,60,0)');
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);

}

function drawNearTrees(pal) {
  const f = 0.6, off = bgCam * f, sp = 150;
  const i0 = Math.floor((off - 120) / sp), i1 = Math.floor((off + VW + 120) / sp);
  const col = rgb(pal.tree);
  for (let i = i0; i <= i1; i++) {
    if (hash(i, 81) < 0.38) continue;
    const x = i * sp - off + hash(i, 82) * 70;
    const h = clamp(GY * 0.45, 120, 260) * (0.7 + hash(i, 83) * 0.5);
    const tw = 7 + hash(i, 84) * 6;
    const top = GY - h;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x - tw, GY + 4);
    ctx.quadraticCurveTo(x - tw * 0.4, GY - h * 0.5, x - tw * 0.3, top + 20);
    ctx.lineTo(x + tw * 0.3, top + 20);
    ctx.quadraticCurveTo(x + tw * 0.4, GY - h * 0.5, x + tw, GY + 4);
    ctx.fill();
    // branch

    ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, by + 20); ctx.quadraticCurveTo(x + 14, by + 4, bx, by); ctx.stroke();
    // canopy blobs
    const cw = 38 + hash(i, 86) * 30;
    ctx.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = k / 5 * TAU + i;
      const cx = x + Math.cos(a) * cw * 0.55, cy = top + 8 + Math.sin(a) * cw * 0.32;
      const cr = cw * (0.42 + hash(i * 7 + k, 87) * 0.15);
      ctx.moveTo(cx + cr, cy); ctx.arc(cx, cy, cr, 0, TAU);
    }
    ctx.fill();
    // hanging lantern
    if (hash(i, 88) < 0.55) {
      const sw = Math.sin(clock * 1.6 + i) * 0.12;
      const len = 26 + hash(i, 89) * 30;
      const lx = bx + Math.sin(sw) * len, ly = by + Math.cos(sw) * len;
      ctx.strokeStyle = col; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(lx, ly); ctx.stroke();
      ctx.globalCompositeOperation = 'lighter';
      const fl = 0.85 + 0.15 * Math.sin(clock * 11 + i * 3);
      const g = ctx.createRadialGradient(lx, ly + 7, 0, lx, ly + 7, 42);
      g.addColorStop(0, `rgba(255,170,80,${0.45 * fl})`); g.addColorStop(1, 'rgba(255,120,40,0)');
      ctx.fillStyle = g; ctx.fillRect(lx - 42, ly - 35, 84, 84);
      ctx.globalCompositeOperation = 'source-over';
      const lg = ctx.createRadialGradient(lx - 2, ly + 5, 0, lx, ly + 7, 8);
      lg.addColorStop(0, '#fff2c8'); lg.addColorStop(0.6, '#ffae4a'); lg.addColorStop(1, '#d9592a');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.ellipse(lx, ly + 7, 6, 7.5, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = col; ctx.fillRect(lx - 3.5, ly - 1, 7, 2.2); ctx.fillRect(lx - 3, ly + 13.5, 6, 2);
    }
  }
}

function drawGround(pal, full) {
  const g = ctx.createLinearGradient(0, GY, 0, VH);
  g.addColorStop(0, rgb(mixc(pal.ground, pal.rim, 0.35)));
  g.addColorStop(0.18, rgb(pal.ground));
  g.addColorStop(1, rgb(mixc(pal.ground, [0, 0, 0], 0.35)));
  ctx.fillStyle = g; ctx.fillRect(-2, GY, VW + 4, VH - GY + 2);
  ctx.fillStyle = rgb(pal.rim);
  ctx.fillRect(-2, GY - 1, VW + 4, 3);
  if (!full) {
    const wg = ctx.createLinearGradient(0, WY, 0, VH);
    wg.addColorStop(0, rgb(mixc(pal.mid, pal.top, 0.4))); wg.addColorStop(1, rgb(pal.top));
    ctx.fillStyle = wg; ctx.fillRect(-2, WY, VW + 4, VH - WY + 2);
    return;
  }
  const off = bgCam, bank = WY - GY;
  // soil strata
  for (let k = 0; k < 3; k++) {
    const y0 = GY + bank * (0.3 + k * 0.22);
    ctx.fillStyle = rgb(mixc(pal.ground, k % 2 ? pal.rim : [0, 0, 0], 0.18));
    ctx.beginPath(); ctx.moveTo(-10, y0 + 6);
    for (let x = -10; x <= VW + 16; x += 10) ctx.lineTo(x, y0 + (vnoise((x + off) * 0.02, 120 + k) - 0.5) * 6);
    ctx.lineTo(VW + 16, y0 + 6); ctx.fill();
  }
  // pebbles and buried stones
  const ps = 34, p0 = Math.floor((off - 20) / ps), p1 = Math.floor((off + VW + 20) / ps);
  for (let i = p0; i <= p1; i++) {
    const x = i * ps - off + hash(i, 91) * 24, y = GY + 8 + hash(i, 92) * (bank - 12);
    ctx.fillStyle = rgb(pal.rim, 0.2 + hash(i, 93) * 0.2);
    ctx.beginPath(); ctx.ellipse(x, y, 2.5 + hash(i, 94) * 6, 1.5 + hash(i, 95) * 2, 0, 0, TAU); ctx.fill();
  }
  drawTufts(pal);
}

// roots threading through the bank and dangling into the water (drawn over the water)
function drawRoots(pal) {
  const off = bgCam, bank = WY - GY;
  const rs = 42, r0 = Math.floor((off - 60) / rs), r1 = Math.floor((off + VW + 60) / rs);
  ctx.lineCap = 'round';
  for (let i = r0; i <= r1; i++) {
    if (hash(i, 131) < 0.45) continue;
    const x = i * rs - off + hash(i, 132) * 30;
    const len = bank * (0.7 + hash(i, 133) * 0.8) + (hash(i, 134) < 0.3 ? 18 : 0);
    const bend = (hash(i, 135) - 0.5) * 30;
    const sway = len > bank ? Math.sin(clock * 1.4 + i) * 2 : 0;
    ctx.strokeStyle = rgb(mixc(pal.ground, pal.rim, 0.55), 0.85);
    ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(x, GY + 2);
    ctx.bezierCurveTo(x + bend * 0.2, GY + len * 0.35, x + bend, GY + len * 0.6, x + bend * 0.6 + sway, GY + len);
    ctx.stroke();
    ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(x + bend * 0.3, GY + len * 0.4);
    ctx.quadraticCurveTo(x + bend * 0.3 - 10, GY + len * 0.55, x + bend * 0.2 - 14, GY + len * 0.75);
    ctx.stroke();
  }
}

function drawTufts(pal) {
  const off = bgCam;
  // grass tufts and flowers
  const ts = 13, t0 = Math.floor((off - 20) / ts), t1 = Math.floor((off + VW + 20) / ts);
  ctx.strokeStyle = rgb(pal.rim); ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = t0; i <= t1; i++) {
    if (hash(i, 96) < 0.45) continue;
    const x = i * ts - off + hash(i, 97) * 8, h = 3 + hash(i, 98) * 7;
    const sw = Math.sin(clock * 2.5 + i * 0.7) * 1.5;
    ctx.moveTo(x, GY + 1); ctx.quadraticCurveTo(x - 1, GY - h * 0.5, x - 2 + sw, GY - h);
    ctx.moveTo(x + 1, GY + 1); ctx.quadraticCurveTo(x + 2, GY - h * 0.6, x + 4 + sw, GY - h * 0.8);
  }
  ctx.stroke();
  for (let i = t0; i <= t1; i++) {
    if (hash(i, 99) > 0.08) continue;
    const x = i * ts - off + 4, h = 8 + hash(i, 100) * 6;
    ctx.strokeStyle = rgb(pal.rim); ctx.beginPath(); ctx.moveTo(x, GY); ctx.lineTo(x + 1, GY - h); ctx.stroke();
    ctx.fillStyle = hash(i, 101) < 0.5 ? '#ffd7e6' : '#bff3ff';
    ctx.beginPath(); ctx.arc(x + 1, GY - h, 2, 0, TAU); ctx.fill();
  }
}

// still pond below the bank: mirrors the scene above the ground line
function drawWater(pal) {
  const hw = VH - WY, k = S * DPR, strip = 3;
  ctx.fillStyle = rgb(mixc(pal.top, [0, 0, 0], 0.3));
  ctx.fillRect(-2, WY, VW + 4, hw + 2);
  ctx.save();
  ctx.globalAlpha = 0.62;
  for (let d = 0; d < hw; d += strip) {
    const sy = GY - d - strip;
    if (sy < 0) break;
    const off = Math.sin(d * 0.28 - clock * 2.2) * (0.6 + d * 0.035) + Math.sin(d * 0.09 + clock * 1.1) * d * 0.025;
    ctx.drawImage(cv, 0, sy * k, cv.width, strip * k, off - 3, WY + d, VW + 6, strip + 0.6);
  }
  ctx.restore();
  // path of the sun / moon on the water
  const ox = VW * 0.7;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const y = WY + 4 + (i / 26) * (hw - 8);
    const w = (10 + hash(i, 141) * 26) * (0.6 + i / 26);
    const a = (0.1 + 0.18 * (0.5 + 0.5 * Math.sin(clock * 2.4 + i * 1.7))) * (1 - i / 30);
    ctx.fillStyle = rgb(pal.halo, a);
    ctx.fillRect(ox - w / 2 + Math.sin(clock * 1.5 + i) * 4, y, w, 1.4);
  }
  // koi drifting under the surface
  for (let f = 0; f < 2; f++) {
    const span = VW + 160, dir = f ? -1 : 1;
    const x = (((hash(f, 151) * span + dir * clock * (18 + f * 8)) % span) + span) % span - 80;
    const y = WY + hw * (0.4 + f * 0.3) + Math.sin(clock * 0.9 + f * 2) * 5;
    const sc = 0.8 + f * 0.35;
    ctx.save(); ctx.translate(x, y); ctx.scale(dir * sc, sc);
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, 26);
    gg.addColorStop(0, 'rgba(255,150,70,0.28)'); gg.addColorStop(1, 'rgba(255,120,50,0)');
    ctx.fillStyle = gg; ctx.fillRect(-26, -26, 52, 52);
    const tl = Math.sin(clock * 6 + f) * 0.4;
    ctx.fillStyle = 'rgba(255,140,70,0.55)';
    ctx.beginPath(); ctx.ellipse(0, 0, 11, 3.6, 0, 0, TAU); ctx.fill();
    ctx.save(); ctx.translate(-10, 0); ctx.rotate(tl);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-9, -5); ctx.lineTo(-7, 0); ctx.lineTo(-9, 5); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(255,240,220,0.5)';
    ctx.beginPath(); ctx.ellipse(3, -0.6, 3.5, 1.6, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
  // depth tint
  const tg = ctx.createLinearGradient(0, WY, 0, VH);
  tg.addColorStop(0, rgb(pal.mid, 0.12)); tg.addColorStop(0.5, rgb(pal.top, 0.35)); tg.addColorStop(1, rgb(mixc(pal.top, [0, 0, 0], 0.4), 0.7));
  ctx.fillStyle = tg; ctx.fillRect(-2, WY, VW + 4, hw + 2);
  // shimmer streaks moving with the world
  const off = bgCam * 1.1, ss = 23;
  const s0 = Math.floor((off - 40) / ss), s1 = Math.floor((off + VW + 40) / ss);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = s0; i <= s1; i++) {
    const q = hash(i, 161);
    const y = WY + 3 + q * q * (hw - 6);
    const x = i * ss - off + hash(i, 162) * 20, w = 6 + hash(i, 163) * 22;
    const a = 0.08 + 0.12 * Math.max(0, Math.sin(clock * 1.7 + i * 2.3));
    ctx.fillStyle = rgb(pal.fog, a);
    ctx.fillRect(x, y, w, 1);
  }
  ctx.globalCompositeOperation = 'source-over';
  // wet, ragged lip of the bank
  ctx.fillStyle = rgb(mixc(pal.ground, [0, 0, 0], 0.3));
  ctx.beginPath(); ctx.moveTo(-10, WY - 3);
  for (let x = -10; x <= VW + 16; x += 8) ctx.lineTo(x, WY + vnoise((x + bgCam) * 0.05, 171) * 5);
  ctx.lineTo(VW + 16, WY - 3); ctx.fill();
  ctx.fillStyle = rgb(pal.fog, 0.35);
  ctx.fillRect(-2, WY + 5, VW + 4, 0.8);
  drawRoots(pal);
  // lily pads, larger and faster nearer the viewer
  const ls = 120;
  for (let layer = 0; layer < 2; layer++) {
    const depth = layer ? 0.75 : 0.3, par = 1 + depth * 0.4, offL = bgCam * par;
    const l0 = Math.floor((offL - 60) / ls), l1 = Math.floor((offL + VW + 60) / ls);
    for (let i = l0; i <= l1; i++) {
      if (hash(i, 181 + layer) < 0.45) continue;
      const x = i * ls - offL + hash(i, 183 + layer) * 70;
      const y = WY + 10 + hw * (depth - 0.12 + hash(i, 185) * 0.2) + Math.sin(clock * 1.2 + i) * 1.2;
      const rx = (10 + hash(i, 187) * 8) * (0.8 + depth * 0.8), ry = rx * 0.3;
      ctx.fillStyle = 'rgba(8,4,16,0.35)';
      ctx.beginPath(); ctx.ellipse(x + 2, y + 2, rx, ry, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = rgb(mixc([40, 92, 74], pal.top, 0.35));
      ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0.25, TAU - 0.05); ctx.lineTo(x, y); ctx.fill();
      ctx.strokeStyle = rgb(mixc([120, 190, 150], pal.fog, 0.3), 0.5); ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.ellipse(x, y, rx * 0.95, ry * 0.9, 0, Math.PI + 0.3, TAU - 0.3); ctx.stroke();
      if (hash(i, 189) < 0.4) {
        const fx0 = x - rx * 0.2, fy0 = y - ry * 0.6;
        ctx.globalCompositeOperation = 'lighter';
        const fg = ctx.createRadialGradient(fx0, fy0, 0, fx0, fy0, 16);
        fg.addColorStop(0, 'rgba(255,170,200,0.35)'); fg.addColorStop(1, 'rgba(255,140,180,0)');
        ctx.fillStyle = fg; ctx.fillRect(fx0 - 16, fy0 - 16, 32, 32);
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#ffc2d6';
        for (let p = 0; p < 5; p++) {
          const a = -Math.PI / 2 + (p - 2) * 0.45;
          ctx.beginPath(); ctx.ellipse(fx0 + Math.cos(a) * 3, fy0 + Math.sin(a) * 3, 3.4, 1.5, a, 0, TAU); ctx.fill();
        }
        ctx.fillStyle = '#fff1a8'; ctx.beginPath(); ctx.arc(fx0, fy0 - 1, 1.4, 0, TAU); ctx.fill();
      }
    }
  }
}

function drawForeground(pal) {
  const off = bgCam * 1.45, sp = 64;
  const i0 = Math.floor((off - 80) / sp), i1 = Math.floor((off + VW + 80) / sp);
  const col = rgb(mixc(pal.ground, [0, 0, 0], 0.55));
  ctx.fillStyle = col;
  for (let i = i0; i <= i1; i++) {
    if (hash(i, 111) < 0.45) continue;
    const x = i * sp - off + hash(i, 112) * 40;
    const n = 4 + ((hash(i, 113) * 4) | 0);
    for (let k = 0; k < n; k++) {
      const h = (22 + hash(i * 9 + k, 114) * 34) * clamp((VH - WY) / 110, 0.7, 1.4);
      const bx = x + (k - n / 2) * 5;
      const lean = (hash(i * 9 + k, 115) - 0.5) * 22 + Math.sin(clock * 1.8 + i + k) * 3;
      ctx.beginPath();
      ctx.moveTo(bx - 3, VH + 4);
      ctx.quadraticCurveTo(bx - 1 + lean * 0.3, VH - h * 0.6, bx + lean, VH - h);
      ctx.quadraticCurveTo(bx + 1 + lean * 0.3, VH - h * 0.6, bx + 3, VH + 4);
      ctx.fill();
    }
  }
}

// ---------- drawing: obstacles & items ----------
function drawObstacle(o, full) {
  const sx = o.x - run.cam;
  if (sx > VW + 60 || sx + o.w < -60) return;
  const cx = sx + o.w / 2;
  if (full) {
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(cx, GY + 2, o.w * 0.6, 4, 0, 0, TAU); ctx.fill();
  }
  if (o.type === 0) {
    const n = Math.max(2, Math.round(o.w / 20));
    const bw = o.w / n;
    ctx.fillStyle = '#5b2352';
    ctx.strokeStyle = '#5b2352'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.rect(sx + 2, GY - o.h * 0.5, o.w - 4, o.h * 0.5 + 1);
    const tops = [];
    for (let k = 0; k < n; k++) {
      const rr = bw * 0.62 + 2, bcx = sx + (k + 0.5) * bw, bcy = GY - o.h + rr * 0.95 + hash(o.s + k, 1) * 4;
      ctx.moveTo(bcx + rr, bcy); ctx.arc(bcx, bcy, rr, 0, TAU); tops.push([bcx, bcy, rr]);
    }
    ctx.fill();
    ctx.beginPath();
    for (const [bx, by, rr] of tops) for (let j = 0; j < 5; j++) {
      const a = -Math.PI + 0.3 + j / 4 * (Math.PI - 0.6);
      ctx.moveTo(bx + Math.cos(a) * rr * 0.9, by + Math.sin(a) * rr * 0.9);
      ctx.lineTo(bx + Math.cos(a) * (rr + 6), by + Math.sin(a) * (rr + 6));
    }
    ctx.stroke();
    if (full) {
      ctx.strokeStyle = 'rgba(255,170,140,0.45)'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      for (const [bx, by, rr] of tops) { ctx.moveTo(bx + Math.cos(-2.4) * rr, by + Math.sin(-2.4) * rr); ctx.arc(bx, by, rr, -2.4, -1.2); }
      ctx.stroke();
    }
    ctx.fillStyle = '#ff5d7a';
    for (let k = 0; k < n; k++) {
      const [bx, by, rr] = tops[k];
      ctx.beginPath(); ctx.arc(bx + (hash(o.s, k + 5) - .5) * rr, by + rr * 0.3, 2.6, 0, TAU); ctx.fill();
    }
  } else if (o.type === 1) {
    const wob = Math.sin(clock * 9 + o.s) * clamp(1 - o.near / 90, 0, 1) * 0.12;
    const capY = GY - o.h * 0.6, rx = o.w / 2 + 3, ry = o.h * 0.44;
    // stem
    const sg = ctx.createLinearGradient(cx - 6, 0, cx + 6, 0);
    sg.addColorStop(0, '#f6ead8'); sg.addColorStop(1, '#bfa48f');
    ctx.fillStyle = sg;
    ctx.beginPath();
    ctx.moveTo(cx - 7, GY + 1);
    ctx.quadraticCurveTo(cx - 2, GY - o.h * 0.3, cx - 5, capY + 2);
    ctx.lineTo(cx + 5, capY + 2);
    ctx.quadraticCurveTo(cx + 3, GY - o.h * 0.3, cx + 8, GY + 1);
    ctx.fill();
    ctx.save(); ctx.translate(cx, capY + 2); ctx.rotate(wob); ctx.scale(1 + wob, 1 - wob);
    const cg = ctx.createLinearGradient(0, -ry, 0, 0);
    cg.addColorStop(0, '#ff86a3'); cg.addColorStop(1, '#b8325f');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.moveTo(-rx, 0);
    ctx.bezierCurveTo(-rx, -ry * 1.25, rx, -ry * 1.25, rx, 0);
    ctx.quadraticCurveTo(0, 5, -rx, 0); ctx.fill();
    ctx.fillStyle = '#6d1f45';
    ctx.beginPath(); ctx.ellipse(0, 0.5, rx * 0.8, 2.6, 0, 0, Math.PI); ctx.fill();
    const spots = [[-.45, -.45, .16], [.1, -.75, .13], [.5, -.35, .12], [-.05, -.3, .09]];
    for (const [a, b, c] of spots) {
      if (full) {
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(a * rx, b * ry, 0, a * rx, b * ry, c * rx * 3);
        g.addColorStop(0, 'rgba(160,255,240,0.5)'); g.addColorStop(1, 'rgba(120,255,230,0)');
        ctx.fillStyle = g; ctx.fillRect(a * rx - c * rx * 3, b * ry - c * rx * 3, c * rx * 6, c * rx * 6);
        ctx.globalCompositeOperation = 'source-over';
      }
      ctx.fillStyle = full ? '#d9fff8' : '#ffe9f0';
      ctx.beginPath(); ctx.arc(a * rx, b * ry, c * rx, 0, TAU); ctx.fill();
    }
    ctx.restore();
  } else {
    const br = 1 + Math.sin(clock * 2.4 + o.s) * 0.04;
    const rx = o.w / 2, ry = o.h * br, by = GY + 1;
    ctx.fillStyle = '#4a2a2c';
    ctx.beginPath();
    const n = 15;
    ctx.moveTo(cx - rx, by);
    for (let k = 0; k <= n; k++) {
      const a = Math.PI + k / n * Math.PI;
      const a2 = Math.PI + (k + 0.5) / n * Math.PI;
      ctx.lineTo(cx + Math.cos(a) * rx * 0.92, by + Math.sin(a) * ry * 0.92);
      if (k < n) ctx.lineTo(cx + Math.cos(a2) * (rx + 7), by + Math.sin(a2) * (ry + 6) - 1);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#8f5d45';
    ctx.beginPath(); ctx.ellipse(cx, by, rx * 0.8, ry * 0.75, 0, Math.PI, TAU); ctx.fill();
    // face looking left (towards the runner)
    const fxp = cx - rx * 0.78, fyp = by - 8;
    ctx.fillStyle = '#e8c7a4';
    ctx.beginPath(); ctx.ellipse(fxp, fyp + 1, 9, 7, 0.2, 0, TAU); ctx.fill();
    ctx.fillStyle = '#26140f';
    ctx.beginPath(); ctx.arc(fxp - 8, fyp + 1, 2.4, 0, TAU); ctx.fill();
    const awake = o.near < 110;
    if (awake) {
      const pwx = run.cam + PX, dx = clamp((pwx - (o.x + o.w / 2)) / 60, -1, 1);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(fxp + 1, fyp - 4, 3.4, 0, TAU); ctx.fill();
      ctx.fillStyle = '#26140f';
      ctx.beginPath(); ctx.arc(fxp + 1 + dx * 1.2, fyp - 5.5, 1.9, 0, TAU); ctx.fill();
    } else {
      ctx.strokeStyle = '#26140f'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(fxp + 1, fyp - 4, 2.6, 0.2, Math.PI - 0.2); ctx.stroke();
      if (full) { // sleepy bubble
        const q = (clock * 0.6 + o.s * 0.001) % 1;
        ctx.strokeStyle = `rgba(230,240,255,${0.6 * (1 - q)})`;
        ctx.beginPath(); ctx.arc(fxp - 4 - q * 6, fyp - 14 - q * 18, 2 + q * 4, 0, TAU); ctx.stroke();
      }
    }
    ctx.fillStyle = 'rgba(255,120,140,0.5)';
    ctx.beginPath(); ctx.ellipse(fxp + 4, fyp + 3, 2.6, 1.6, 0, 0, TAU); ctx.fill();
  }
}

function drawItem(it, full) {
  if (it.taken) return;
  const x = it.x - run.cam;
  if (x < -30 || x > VW + 30) return;
  const y = GY - it.y + Math.sin(clock * 3 + it.ph) * 3;
  if (full) {
    ctx.globalCompositeOperation = 'lighter';
    const pulse = 0.8 + 0.2 * Math.sin(clock * 6 + it.ph * 2);
    const g = ctx.createRadialGradient(x, y, 0, x, y, 20);
    g.addColorStop(0, `rgba(255,245,180,${0.9 * pulse})`); g.addColorStop(0.25, `rgba(255,210,90,${0.45 * pulse})`); g.addColorStop(1, 'rgba(255,160,40,0)');
    ctx.fillStyle = g; ctx.fillRect(x - 20, y - 20, 40, 40);
    ctx.globalCompositeOperation = 'source-over';
  }
  const flap = Math.abs(Math.sin(clock * 26 + it.ph * 3));
  ctx.fillStyle = 'rgba(230,245,255,0.75)';
  ctx.beginPath(); ctx.ellipse(x - 3, y - 4, 4.2, 2.4 * flap + 0.5, -0.6, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + 3, y - 4, 4.2, 2.4 * flap + 0.5, 0.6, 0, TAU); ctx.fill();
  ctx.fillStyle = '#fff6c2';
  ctx.beginPath(); ctx.arc(x, y, 3.6, 0, TAU); ctx.fill();
}

// ---------- drawing: the lantern ----------
function drawPlayer(full) {
  const ccx = PX, ccy = GY - P.y - HC;
  const g = 0.85 + P.glow * 0.5 + Math.sin(clock * 13) * 0.04 + Math.sin(clock * 5.3) * 0.04;
  if (full) {
    ctx.globalCompositeOperation = 'lighter';
    const rg = ctx.createRadialGradient(ccx, ccy, 4, ccx, ccy, 150);
    rg.addColorStop(0, `rgba(255,190,100,${0.42 * g})`); rg.addColorStop(0.35, `rgba(255,140,60,${0.14 * g})`); rg.addColorStop(1, 'rgba(255,110,40,0)');
    ctx.fillStyle = rg; ctx.fillRect(ccx - 150, ccy - 150, 300, 300);
    const gl = clamp(1 - P.y / 160, 0, 1);
    const eg = ctx.createRadialGradient(ccx, GY + 2, 0, ccx, GY + 2, 80);
    eg.addColorStop(0, `rgba(255,170,90,${0.38 * gl * g})`); eg.addColorStop(1, 'rgba(255,130,60,0)');
    ctx.save(); ctx.translate(ccx, GY + 2); ctx.scale(1, 0.2); ctx.translate(-ccx, -(GY + 2));
    ctx.fillStyle = eg; ctx.fillRect(ccx - 80, GY - 78, 160, 160);
    ctx.restore();
    ctx.globalCompositeOperation = 'source-over';
    // scarf
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let i = 1; i < scarf.length; i++) {
      const a = scarf[i - 1], b = scarf[i];
      ctx.strokeStyle = i % 2 ? '#38c9c1' : '#2aa8a8';
      ctx.lineWidth = lerp(6, 2.4, i / scarf.length);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  } else {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(ccx, GY + 2, 16, 3, 0, 0, TAU); ctx.fill();
  }
  ctx.save();
  ctx.translate(ccx, ccy);
  if (full) ctx.rotate(P.rot);
  const sq = P.sq, sx = 1 - sq * 0.55, sy = 1 + sq;
  // legs
  ctx.strokeStyle = '#3a1a14'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  for (let k = 0; k < 2; k++) {
    const hx = (k ? 4 : -4), hy = R * sy - 2;
    let fx2, fy2;
    if (P.ground) {
      const ph = P.phase + k * Math.PI;
      fx2 = hx + Math.sin(ph) * 7; fy2 = R * sy + LEG - Math.max(0, -Math.cos(ph)) * 5;
    } else { fx2 = hx + 5 - k * 2; fy2 = R * sy + LEG - 3 + k; }
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(fx2, fy2); ctx.lineTo(fx2 + 3, fy2); ctx.stroke();
  }
  ctx.translate(0, R + LEG); ctx.scale(sx, sy); ctx.translate(0, -(R + LEG));
  const bob = P.ground ? -Math.abs(Math.sin(P.phase)) * 2.2 : 0;
  ctx.translate(0, bob);
  // antenna sprout
  const ax = P.ax * 6;
  ctx.strokeStyle = '#3a1a14'; ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(0, -R - 2);
  ctx.quadraticCurveTo(-2, -R - 10, 4 - ax * 0.5, -R - 15 + ax);
  ctx.stroke();
  ctx.fillStyle = '#7fd67a';
  ctx.save(); ctx.translate(4 - ax * 0.5, -R - 15 + ax); ctx.rotate(-0.5 + ax * 0.08 + Math.sin(clock * 4) * 0.1);
  ctx.beginPath(); ctx.ellipse(4, 0, 5, 2.6, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = '#b7f0a6'; ctx.beginPath(); ctx.ellipse(3, -0.6, 2.6, 0.9, 0, 0, TAU); ctx.fill();
  ctx.restore();
  // body
  const bg = ctx.createRadialGradient(-5, -5, 1, 0, 0, R * 1.15);
  if (full) { bg.addColorStop(0, '#fffbe6'); bg.addColorStop(0.35, '#ffd877'); bg.addColorStop(0.75, '#f58a36'); bg.addColorStop(1, '#b8461f'); }
  else { bg.addColorStop(0, '#ffd877'); bg.addColorStop(1, '#f07f2e'); }
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.ellipse(0, 0, R + 1, R, 0, 0, TAU); ctx.fill();
  // ribs
  ctx.strokeStyle = 'rgba(160,60,20,0.32)'; ctx.lineWidth = 1;
  for (const k of [-0.55, 0, 0.55]) {
    ctx.beginPath(); ctx.ellipse(0, k * R, (R + 1) * Math.sqrt(1 - k * k), 3, 0, 0, Math.PI); ctx.stroke();
  }
  // caps
  ctx.fillStyle = '#3a1a14';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-8, -R - 3, 16, 5, 2) : ctx.rect(-8, -R - 3, 16, 5); ctx.fill();
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-7, R - 2, 14, 4, 2) : ctx.rect(-7, R - 2, 14, 4); ctx.fill();
  // scarf wrap
  if (full) {
    ctx.strokeStyle = '#38c9c1'; ctx.lineWidth = 5; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.ellipse(0, R * 0.42, R * 0.9, 3, 0, 0.15, Math.PI - 0.15); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.ellipse(0, R * 0.42 - 1, R * 0.86, 3, 0, 0.5, Math.PI - 0.6); ctx.stroke();
  }
  // face
  const tgt = run.items.find(i => !i.taken && i.x > run.cam + PX + 10 && i.x < run.cam + PX + 240);
  let lx = 1, ly = 0;
  if (tgt) {
    const dx = tgt.x - (run.cam + PX), dy = -(tgt.y - (P.y + HC));
    const d = Math.hypot(dx, dy) || 1; lx = dx / d; ly = dy / d;
  }
  const nearObs = run.obs.find(o => o.x + o.w > run.cam + PX && o.x - (run.cam + PX) < 120);
  const blinkK = Math.floor(clock / 2.7), blinkP = clock / 2.7 - blinkK;
  const blink = blinkP > 0.9 + hash(blinkK, 5) * 0.06 && blinkP < 0.96 + hash(blinkK, 5) * 0.06 || (hash(blinkK, 6) < 0.25 && blinkP > 0.7 && blinkP < 0.74);
  const flipping = full && P.flip && !P.ground;
  const happy = P.happy > 0;
  const wide = P.ground && nearObs && !happy;
  ctx.fillStyle = '#3a1a14'; ctx.strokeStyle = '#3a1a14'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
  const eyes = [[2, -3], [11, -3.5]];
  for (const [ex, ey] of eyes) {
    if (flipping) {
      ctx.beginPath(); ctx.moveTo(ex - 2.5, ey - 2); ctx.lineTo(ex + 1.5, ey); ctx.lineTo(ex - 2.5, ey + 2); ctx.stroke();
    } else if (happy) {
      ctx.beginPath(); ctx.arc(ex, ey + 1, 2.8, Math.PI + 0.3, TAU - 0.3); ctx.stroke();
    } else if (blink) {
      ctx.beginPath(); ctx.moveTo(ex - 2.6, ey); ctx.lineTo(ex + 2.6, ey); ctx.stroke();
    } else {
      const er = wide ? 4.3 : 3.6;
      ctx.fillStyle = '#fffdf5';
      ctx.beginPath(); ctx.ellipse(ex, ey, er * 0.85, er, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#2a120c';
      ctx.beginPath(); ctx.arc(ex + lx * 1.3, ey + ly * 1.4, wide ? 2.1 : 2.3, 0, TAU); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(ex + lx * 1.3 + 0.8, ey + ly * 1.4 - 0.9, 0.8, 0, TAU); ctx.fill();
    }
  }
  // mouth
  ctx.strokeStyle = '#3a1a14'; ctx.lineWidth = 1.5;
  if (!P.ground && P.vy > 0 && !flipping) {
    ctx.fillStyle = '#7a2a1a'; ctx.beginPath(); ctx.ellipse(7, 4.5, 2, 2.4, 0, 0, TAU); ctx.fill();
  } else if (wide) {
    ctx.fillStyle = '#7a2a1a'; ctx.beginPath(); ctx.ellipse(7, 4.5, 1.5, 1.6, 0, 0, TAU); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(7, 2.5, happy ? 3 : 2.2, 0.25, Math.PI - 0.25); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,90,90,0.38)';
  ctx.beginPath(); ctx.ellipse(-2.5, 3, 2.6, 1.6, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(15, 2.2, 2, 1.5, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of parts) {
    const k = p.life / p.max, x = p.x - run.cam, y = p.y;
    if (p.t === 'dust') {
      ctx.fillStyle = `rgba(230,200,220,${0.35 * (1 - k)})`;
      ctx.beginPath(); ctx.arc(x, y, p.size * (0.6 + k), 0, TAU); ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) {
    const k = p.life / p.max, x = p.x - run.cam, y = p.y;
    if (p.t === 'spark') {
      ctx.fillStyle = p.col ? `rgba(255,200,120,${1 - k})` : `rgba(255,244,170,${1 - k})`;
      ctx.beginPath(); ctx.arc(x, y, p.size * (1 - k * 0.5), 0, TAU); ctx.fill();
    } else if (p.t === 'ember') {
      ctx.fillStyle = `rgba(255,170,70,${0.8 * (1 - k)})`;
      ctx.fillRect(x, y, p.size, p.size);
    } else if (p.t === 'ring') {
      ctx.strokeStyle = `rgba(255,230,160,${0.8 * (1 - k)})`; ctx.lineWidth = 2 * (1 - k) + 0.3;
      ctx.beginPath(); ctx.arc(x, y, p.size * easeIO(k) * 0.9 + 3, 0, TAU); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- HUD ----------
function spaced(str, x, y, sp, align) {
  let w = 0; const ws = [];
  for (const ch of str) { const cw = ctx.measureText(ch).width; ws.push(cw); w += cw + sp; }
  w -= sp;
  let cx = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  let i = 0;
  ctx.textAlign = 'left';
  for (const ch of str) { ctx.fillText(ch, cx, y); cx += ws[i++] + sp; }
  return w;
}
function drawHUD(full) {
  ctx.textBaseline = 'alphabetic';
  const score = String(run.score);
  const pop = 1 + easeIO(run.pop) * 0.18;
  if (full) {
    ctx.save();
    ctx.translate(22, 52);
    ctx.scale(pop, pop);
    ctx.font = `800 40px ${FONT}`;
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(20,8,30,0.35)';
    ctx.fillText(score, 0, 3);
    const gg = ctx.createLinearGradient(0, -34, 0, 0);
    gg.addColorStop(0, '#fff6dc'); gg.addColorStop(1, '#ffbf6a');
    ctx.fillStyle = gg;
    ctx.fillText(score, 0, 0);
    ctx.restore();
    // firefly tally
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(28, 70, 0, 28, 70, 9);
    g.addColorStop(0, 'rgba(255,240,170,0.9)'); g.addColorStop(1, 'rgba(255,190,80,0)');
    ctx.fillStyle = g; ctx.fillRect(19, 61, 18, 18);
    ctx.restore();
    ctx.fillStyle = '#fff6c2'; ctx.beginPath(); ctx.arc(28, 70, 3, 0, TAU); ctx.fill();
    ctx.font = `700 13px ${FONT}`; ctx.fillStyle = 'rgba(255,240,220,0.8)';
    ctx.fillText(String(run.flies), 38, 75);
    // title
    ctx.font = `800 13px ${FONT}`;
    ctx.fillStyle = 'rgba(255,236,214,0.9)';
    const tw = spaced('LANTERN HOP', VW - 22, 34, 3.2, 'right');
    const lx = VW - 22 - tw - 14, ly = 29;
    ctx.globalCompositeOperation = 'lighter';
    const lg = ctx.createRadialGradient(lx, ly, 0, lx, ly, 12);
    lg.addColorStop(0, 'rgba(255,190,90,0.8)'); lg.addColorStop(1, 'rgba(255,140,50,0)');
    ctx.fillStyle = lg; ctx.fillRect(lx - 12, ly - 12, 24, 24);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ffc56a'; ctx.beginPath(); ctx.ellipse(lx, ly, 4.2, 4.8, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#3a1a14'; ctx.fillRect(lx - 2.5, ly - 6, 5, 1.6); ctx.fillRect(lx - 2.5, ly + 4.6, 5, 1.6);
    // hint
    const human = clock < humanUntil;
    ctx.font = `700 9.5px ${FONT}`;
    ctx.fillStyle = `rgba(255,230,240,${human ? 0.3 : 0.55})`;
    spaced('SPACE  ·  TAP TO JUMP', VW - 22, 54, 2.2, 'right');
  } else {
    ctx.font = `800 28px ${FONT}`; ctx.textAlign = 'left';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(score, 20, 42);
    ctx.font = `700 10px ${FONT}`;
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.textAlign = 'right';
    ctx.fillText('SPACE / TAP TO JUMP', VW - 20, 36);
  }
}

// ---------- render ----------
function render() {
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  if (stage === 1) {
    ctx.fillStyle = '#8fb8de'; ctx.fillRect(-2, -2, VW + 4, VH + 4);
    ctx.fillStyle = '#7b7b7b'; ctx.fillRect(-2, GY, VW + 4, VH - GY + 4);
    ctx.fillStyle = '#e04848';
    for (const o of run.obs) ctx.fillRect(o.x - run.cam, GY - o.h, o.w, o.h);
    ctx.fillStyle = '#f2d230';
    for (const it of run.items) if (!it.taken) { ctx.beginPath(); ctx.arc(it.x - run.cam, GY - it.y, 6, 0, TAU); ctx.fill(); }
    ctx.fillStyle = '#f08a24';
    ctx.fillRect(PX - R, GY - P.y - HC * 2 + LEG, R * 2, HC * 2 - LEG);
    return;
  }
  const full = stage === 3;
  const pal = palAt(clock, full);
  drawSky(pal, full);
  if (full) {
    ridge(0.06, GY - 46, clamp(GY * 0.4, 90, 230), 0.0042, 11, rgb(pal.far), true);
    fogBand(GY - 140, GY - 34, pal.fog, 0.35);
    drawWhale(pal);
    ridge(0.14, GY - 28, clamp(GY * 0.28, 64, 160), 0.006, 19, rgb(pal.mtn), true);
    fogBand(GY - 100, GY - 20, pal.fog, 0.28);
  }
  drawHills(pal, full);
  if (full) {
    fogBand(GY - 70, GY, pal.fog, 0.18);
    drawMotes();
    drawNearTrees(pal);
  }
  drawGround(pal, full);
  for (const o of run.obs) drawObstacle(o, full);
  for (const it of run.items) drawItem(it, full);
  drawPlayer(full);
  if (full) {
    drawParticles();
    drawWater(pal);
    drawForeground(pal);
    const vg = ctx.createRadialGradient(VW / 2, VH * 0.45, Math.min(VW, VH) * 0.35, VW / 2, VH * 0.45, Math.max(VW, VH) * 0.8);
    vg.addColorStop(0, 'rgba(10,4,24,0)'); vg.addColorStop(1, 'rgba(10,4,24,0.5)');
    ctx.fillStyle = vg; ctx.fillRect(-2, -2, VW + 4, VH + 4);
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,236,210,${flash * 0.6})`; ctx.fillRect(-2, -2, VW + 4, VH + 4); }
  drawHUD(full);
}

// ---------- loop ----------
const STEP = 1 / 120;
let last = null, acc = 0;
const RM = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
let still = !!(RM && RM.matches), looping = false;

// Reduced motion: replay the seeded run to a moment mid-jump over an obstacle, then hold it.
function composeStill() {
  fx = mulberry32(0xC0FFEE);
  runs = 0; clock = 0; bgCam = 0; flash = 0; humanUntil = -1; jumpBuf = 0; pendingPress = false;
  parts.length = 0; scarfInit = false;
  newRun(); step(0);
  for (let i = 0; i < 120 * 120; i++) {
    step(STEP);
    if (clock < 12 || P.ground || Math.abs(P.vy) > 40) continue;
    const pwx = run.cam + PX;
    if (!P.flip && run.obs.some(o => Math.abs(o.x + o.w / 2 - pwx) < 10)) break;
    if (clock > 100) break;
  }
  render();
}

function startLoop() {
  if (looping) return;
  looping = true; last = null; acc = 0;
  requestAnimationFrame(frame);
}

function frame(ts) {
  if (still) { looping = false; return; }
  requestAnimationFrame(frame);
  resize();
  if (last === null) last = ts;
  let dt = (ts - last) / 1000; last = ts;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 16) { step(STEP); acc -= STEP; n++; }
  if (n >= 16) acc = 0;
  render();
}

// ---------- input ----------
function press() { pendingPress = true; }
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.key === ' ' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!e.repeat) press();
  }
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); press(); }, { passive: false });
cv.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
addEventListener('resize', () => { resize(); if (still) render(); });

window.build = function (n) {
  n = Number(n);
  stage = n === 1 || n === 2 ? n : 3;
  if (run) { resize(); render(); }
  return stage;
};

if (RM) {
  const onChange = () => {
    still = RM.matches;
    if (still) composeStill(); else startLoop();
  };
  if (RM.addEventListener) RM.addEventListener('change', onChange);
  else if (RM.addListener) RM.addListener(onChange);
}

resize();
if (still) composeStill();
else {
  newRun();
  step(0);
  render();
  startLoop();
}
})();
</script>
</body>
