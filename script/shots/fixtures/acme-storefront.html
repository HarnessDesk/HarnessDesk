<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acme Storefront</title>
<style>
  :root { color-scheme: light; --paper:#faf8f3; --ink:#263b31; --line:#d6dfd5; --accent:#c5e4b0; }
  @media (prefers-color-scheme:dark) { :root { color-scheme:dark; --paper:#17241e; --ink:#e1ecdc; --line:#3d5144; --accent:#b5d4a0; } }
  * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.55 system-ui,sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:22px 34px; border-bottom:1px solid var(--line); }
  header strong { letter-spacing:-.03em; font-size:20px; } nav { display:flex; gap:24px; font-size:13px; }
  main { max-width:660px; margin:auto; padding:44px 34px; } .eyebrow { font-size:11px; letter-spacing:.15em; text-transform:uppercase; }
  h1 { font:500 58px/1.05 Georgia,serif; letter-spacing:-.04em; margin:22px 0; max-width:450px; }
  p { max-width:390px; margin:0 0 24px; } a { color:inherit; text-decoration:none; }
  .action { display:inline-flex; padding:11px 20px; border-radius:30px; background:var(--accent); color:#203425; font-weight:600; }
  footer { display:flex; justify-content:space-between; gap:16px; border-top:1px solid var(--line); padding:22px 34px; font-size:12px; }
</style>
<header><strong>acme / storefront</strong><nav aria-label="Site"><a href="#shop">Shop</a><a href="#about">Our story</a><a href="#cart">Bag · 0</a></nav></header>
<main id="shop"><span class="eyebrow">Made for the everyday</span><h1>A calmer checkout.</h1><p>Thoughtful essentials, a small collection, and a checkout that takes care of the details.</p><a class="action" href="#collection">Explore the collection ↗</a></main>
<footer id="about"><span>A few good things. Built to last.</span><span>Acme · Since 2024</span></footer>
</html>
