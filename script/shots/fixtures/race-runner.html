<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runner</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 600 14px/1 ui-monospace, "SF Mono", Menlo, monospace; }
canvas { display: block; width: 100vw; height: 100vh; }
</style>
<body>
<canvas id="c"></canvas>
<script>
/*
 * Two attempts at one brief — "a one-file side-scrolling runner" — for the README race.
 * The camera sets the build level (0 empty page … 3 finished game) through window.build(n),
 * the way a reload after each of the agent's edits would; the clock drives everything else.
 */
const attempt = new URL(location.href).port === '30020' || location.search.includes('b') ? 'b' : 'a'
const canvas = document.getElementById('c')
const ctx = canvas.getContext('2d')
let level = 0
let started = performance.now()
window.build = n => { if (n !== level) { level = n; started = performance.now() } }
const size = () => {
  const r = devicePixelRatio || 1
  canvas.width = innerWidth * r; canvas.height = innerHeight * r
  ctx.setTransform(r, 0, 0, r, 0, 0)
}
addEventListener('resize', size); size()

/* A deterministic course: obstacles every so many pixels, the runner jumps over each. */
const SPEED = 230
const GAP = 260
const jumpAt = (x, period) => {
  // Signed distance past the nearest obstacle; the jump is centred on clearing it.
  const into = ((x % period) + period * 1.5) % period - period / 2
  const t = (into + 65) / 130
  return t > 0 && t < 1 ? Math.sin(Math.PI * t) : 0
}

const hud = (w, title, score, best, color, sub) => {
  ctx.fillStyle = color
  ctx.font = '700 15px ui-monospace, "SF Mono", Menlo, monospace'
  ctx.textBaseline = 'top'
  ctx.fillText(title, 22, 20)
  ctx.textAlign = 'right'
  ctx.font = '700 26px ui-monospace, "SF Mono", Menlo, monospace'
  ctx.fillText(String(score).padStart(5, '0'), w - 22, 16)
  ctx.font = '600 11px ui-monospace, "SF Mono", Menlo, monospace'
  ctx.globalAlpha = 0.7
  ctx.fillText(`BEST ${best}`, w - 22, 48)
  ctx.textAlign = 'left'
  ctx.fillText(sub, 22, 42)
  ctx.globalAlpha = 1
}

/* Attempt A: a neon night run over a perspective grid. */
const drawA = (now, w, h) => {
  const t = (now - 0) / 1000
  const g = ctx.createLinearGradient(0, 0, 0, h)
  g.addColorStop(0, '#120a2e'); g.addColorStop(0.62, '#3a0f4f'); g.addColorStop(1, '#0b0718')
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h)
  const ground = h * 0.72
  if (level === 0) return blank(w, h, '#e9ddff', 'index.html')
  // sun
  const sunR = Math.min(w, h) * 0.2
  const sg = ctx.createLinearGradient(0, ground - sunR * 1.6, 0, ground)
  sg.addColorStop(0, '#ffd36e'); sg.addColorStop(1, '#ff3d8b')
  ctx.fillStyle = sg
  ctx.beginPath(); ctx.arc(w * 0.62, ground - sunR * 0.35, sunR, Math.PI, 0); ctx.fill()
  ctx.fillStyle = '#3a0f4f'
  for (let i = 0; i < 5; i++) ctx.fillRect(w * 0.62 - sunR, ground - sunR * 0.35 - i * 9 - 4, sunR * 2, 2 + i * 0.6)
  // mountains
  ctx.fillStyle = '#1d0c3a'
  ctx.beginPath(); ctx.moveTo(0, ground)
  for (let x = 0; x <= w; x += 40) ctx.lineTo(x, ground - 30 - 28 * Math.abs(Math.sin((x + t * 18) / 90)))
  ctx.lineTo(w, ground); ctx.fill()
  // grid floor
  ctx.fillStyle = '#0b0718'; ctx.fillRect(0, ground, w, h - ground)
  ctx.strokeStyle = 'rgba(255, 61, 200, 0.75)'; ctx.lineWidth = 1.2
  ctx.beginPath(); ctx.moveTo(0, ground); ctx.lineTo(w, ground); ctx.stroke()
  const scroll = level >= 2 ? (t * SPEED) % 40 : 0
  for (let i = 0; i < 14; i++) {
    const y = ground + Math.pow((i * 40 + 40 - scroll) / 560, 2) * (h - ground) * 1.9
    if (y > h) continue
    ctx.globalAlpha = 0.25 + 0.6 * (y - ground) / (h - ground)
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke()
  }
  ctx.globalAlpha = 0.55
  for (let i = -12; i <= 12; i++) { ctx.beginPath(); ctx.moveTo(w / 2 + i * 26, ground); ctx.lineTo(w / 2 + i * 150, h); ctx.stroke() }
  ctx.globalAlpha = 1
  // runner and spikes
  const run = level >= 2 ? t * SPEED : 0
  const px = w * 0.22
  const lift = level >= 2 ? jumpAt(run + px, GAP) * 92 : 0
  if (level >= 2) {
    ctx.fillStyle = '#22f3ff'; ctx.shadowColor = '#22f3ff'; ctx.shadowBlur = 12
    for (let x = -((run) % GAP) + GAP; x < w + GAP; x += GAP) {
      ctx.beginPath(); ctx.moveTo(x - 14, ground); ctx.lineTo(x, ground - 30); ctx.lineTo(x + 14, ground); ctx.fill()
    }
  }
  ctx.shadowColor = '#ff3dc8'; ctx.shadowBlur = 18
  ctx.fillStyle = '#ff3dc8'
  ctx.save(); ctx.translate(px, ground - 15 - lift); ctx.rotate(level >= 2 ? (lift > 0 ? (run / 60) % (Math.PI / 2) : 0) : 0)
  ctx.fillRect(-15, -15, 30, 30); ctx.restore()
  ctx.shadowBlur = 0
  if (level >= 2) {
    // trail
    for (let i = 1; i < 6; i++) {
      ctx.globalAlpha = 0.18 - i * 0.03
      ctx.fillStyle = '#ff3dc8'
      ctx.fillRect(px - 15 - i * 14, ground - 30 - jumpAt(run + px - i * 14, GAP) * 92, 30, 30)
    }
    ctx.globalAlpha = 1
  }
  if (level >= 3) hud(w, 'NEON RUN', Math.floor(run / 10), 2048, '#ffe9ff', 'ARROWS / SPACE')
}

/* Attempt B: a daytime fox run over rolling hills. */
const drawB = (now, w, h) => {
  const t = now / 1000
  const g = ctx.createLinearGradient(0, 0, 0, h)
  g.addColorStop(0, '#9fd8f5'); g.addColorStop(1, '#fdf1d8')
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h)
  const ground = h * 0.74
  if (level === 0) return blank(w, h, '#29435c', 'index.html')
  const run = level >= 2 ? t * SPEED : 0
  // sun + clouds
  ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(w * 0.8, h * 0.2, 30, 0, Math.PI * 2); ctx.fill()
  ctx.fillStyle = 'rgba(255,255,255,0.92)'
  for (let i = 0; i < 4; i++) {
    const x = ((i * 230 - run * 0.15) % (w + 200) + w + 200) % (w + 200) - 100
    const y = h * (0.14 + 0.08 * (i % 2))
    ctx.beginPath(); ctx.ellipse(x, y, 40, 14, 0, 0, Math.PI * 2); ctx.ellipse(x + 26, y - 8, 26, 14, 0, 0, Math.PI * 2); ctx.fill()
  }
  // hills, two layers
  const hills = (offset, color, base, amp, wave) => {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, h)
    for (let x = 0; x <= w + 10; x += 10) ctx.lineTo(x, base - amp * (0.5 + 0.5 * Math.sin((x + offset) / wave)))
    ctx.lineTo(w, h); ctx.fill()
  }
  hills(run * 0.2, '#b9dca0', ground - 20, 60, 120)
  hills(run * 0.45, '#8cc47a', ground + 4, 34, 80)
  // ground strip
  ctx.fillStyle = '#6aa85b'; ctx.fillRect(0, ground, w, 10)
  ctx.fillStyle = '#d9b77c'; ctx.fillRect(0, ground + 10, w, h - ground)
  ctx.fillStyle = '#c49c5f'
  for (let x = -(run % 34); x < w; x += 34) ctx.fillRect(x, ground + 22, 16, 3)
  const px = w * 0.24
  if (level >= 2) {
    // logs and coins
    for (let x = -((run) % GAP) + GAP; x < w + GAP; x += GAP) {
      ctx.fillStyle = '#8a5a32'; ctx.beginPath(); ctx.roundRect(x - 18, ground - 22, 36, 22, 6); ctx.fill()
      ctx.fillStyle = '#e8b878'; ctx.beginPath(); ctx.ellipse(x + 14, ground - 11, 5, 9, 0, 0, Math.PI * 2); ctx.fill()
      if (level >= 3) {
        ctx.fillStyle = '#ffc93c'; ctx.beginPath(); ctx.arc(x, ground - 96 + 4 * Math.sin(t * 6 + x), 8, 0, Math.PI * 2); ctx.fill()
        ctx.fillStyle = '#fff2b0'; ctx.fillRect(x - 2, ground - 101 + 4 * Math.sin(t * 6 + x), 3, 9)
      }
    }
  }
  const lift = level >= 2 ? jumpAt(run + px, GAP) * 96 : 0
  const step = level >= 2 && lift === 0 ? Math.sin(t * 22) : 0
  // fox
  ctx.save(); ctx.translate(px, ground - 2 - lift)
  ctx.fillStyle = '#ef7d2d'
  ctx.beginPath(); ctx.ellipse(0, -22, 24, 14, 0, 0, Math.PI * 2); ctx.fill() // body
  ctx.beginPath(); ctx.moveTo(-20, -26); ctx.quadraticCurveTo(-52, -40 - step * 4, -44, -12); ctx.quadraticCurveTo(-34, -18, -20, -18); ctx.fill() // tail
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(-44, -14, 6, 4, 0.5, 0, Math.PI * 2); ctx.fill()
  ctx.fillStyle = '#ef7d2d'
  ctx.beginPath(); ctx.arc(22, -34, 12, 0, Math.PI * 2); ctx.fill() // head
  ctx.beginPath(); ctx.moveTo(16, -42); ctx.lineTo(20, -58); ctx.lineTo(27, -43); ctx.fill() // ear
  ctx.beginPath(); ctx.moveTo(30, -36); ctx.lineTo(42, -30); ctx.lineTo(30, -27); ctx.fill() // snout
  ctx.fillStyle = '#2a1a10'; ctx.beginPath(); ctx.arc(26, -37, 2, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(42, -30, 2.2, 0, Math.PI * 2); ctx.fill()
  ctx.strokeStyle = '#5a2e12'; ctx.lineWidth = 4; ctx.lineCap = 'round'
  for (const [x, s] of [[-12, 1], [12, -1]]) { ctx.beginPath(); ctx.moveTo(x, -12); ctx.lineTo(x + 7 * step * s, 0); ctx.stroke() }
  ctx.restore()
  if (level >= 3) hud(w, 'FOX DASH', Math.floor(run / 13) + 40, 1730, '#29435c', 'SPACE TO JUMP')
}

const blank = (w, h, color, file) => {
  ctx.fillStyle = color
  ctx.globalAlpha = 0.55
  ctx.font = '600 13px ui-monospace, "SF Mono", Menlo, monospace'
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
  ctx.fillText('Waiting for the first build…', w / 2, h / 2)
  ctx.textAlign = 'left'; ctx.globalAlpha = 1
}

const frame = now => {
  const w = innerWidth, h = innerHeight
  ctx.clearRect(0, 0, w, h)
  ;(attempt === 'a' ? drawA : drawB)(now, w, h)
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame)
</script>
</body>
</html>
